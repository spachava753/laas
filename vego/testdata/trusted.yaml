    vouches: [h]

  (*guide.Hub).Fire:
    reason: Calls each event of h with n, on the calling goroutine, before it returns. Read 2026-11-20.
    requires: ["h != nil", "n >= 0"]
    runs: [h]
    modifies: []

  guide.tell:
    reason: The guide's example of a trusted function that is handed an error, with neither runs nor keeps.
    modifies: []

  foreignlib.Keeps:
    reason: Lists keeps, which a type cannot.
    keeps:
      e: [e]
    modifies: []

  (time.Duration).String:
    reason: A test of a trusted String method run by formatting; it only reads the number.
    modifies: []

  originpath.vouched:
    reason: Test helper whose errors are claimed to be harmless.
    vouches: [err]
    modifies: []

  originpath.unvouched:
    reason: Test helper whose errors nothing vouches for.
    modifies: []

  originpath.closeIt:
    reason: Test helper whose errors nothing vouches for.
    modifies: []

  originpath.log:
    reason: Test helper that takes an error and does nothing with it.
    modifies: []

  # Generic functions of another package, for the corpus generics.
  genericslib.Find:
    reason: Test entry for a generic function that compares elements.
    asserts: {S: [], E: []}
    modifies: []
    ensures:
      - "-1 <= result And result < |s|"
      - "result >= 0 -> s[result] = v"

  genericslib.FindFunc:
    reason: Test entry for a generic function handed a function of the element type.
    runs: [f]
    calls:
      f(e): {}
    asserts: {S: [], E: []}
    modifies: []
    ensures:
      - "-1 <= result And result < |s|"

  genericslib.FindWhere:
    reason: Test entry whose calls requires names a field of a value of a type parameter.
    runs: [f]
    calls:
      f(e):
        requires: ["e.X > 0"]
    asserts: {S: [], E: []}
    modifies: []

  genericslib.Top:
    reason: Test entry for a generic function that orders elements.
    asserts: {S: [], E: []}
    requires: ["|s| > 0"]
    modifies: []
    ensures:
      - "Forall i in [0, |s|) : s[i] <= result"

  genericslib.Filter:
    reason: Test entry for a generic function that writes its slice while it runs what it is handed.
    runs: [f]
    calls:
      f(e): {}
    asserts: {S: [], E: []}
    modifies: [s]
    ensures:
      - "|result| <= |s|"

  genericslib.Reset:
    reason: Test entry for a generic function that writes its slice.
    asserts: {S: [], E: []}
    modifies: [s]

  genericslib.GrowBy:
    reason: Test entry whose requires bounds an allocation by the size of an element.
    asserts: {S: [], E: []}
    requires:
      - "n >= 0"
      - "|s| + n <= MaxInt"
      - "2 * (|s| + n) * elemsize(s) + 65536 <= MaxAlloc"
    modifies: []
    ensures:
      - "|result| = |s|"
      - "cap(result) - |result| >= n"

  genericslib.Same:
    reason: Test entry for a generic function of one value.
    asserts: {E: []}
    modifies: []
    ensures: ["result = x"]

  genericslib.Big:
    reason: Test entry that contradicts itself where E is uint8 only.
    asserts: {E: []}
    modifies: []
    ensures: ["result > 300"]

  genericslib.Name:
    reason: Test entry that names a field of a value of a type parameter.
    asserts: {E: []}
    modifies: []
    ensures: ["result = x.N"]

  genericslib.Locked:
    reason: Test entry that names a state of a value of a type parameter.
    asserts: {T: []}
    requires: ["~held(x)"]
    modifies: []

  genericslib.Address:
    reason: Test entry that takes the address of a value of a type parameter.
    asserts: {E: []}
    requires: ["|s| > 0 -> &s[0] != nil"]
    modifies: []

  genericslib.Sized:
    reason: Test entry that asks the element size of an integer.
    asserts: {E: []}
    requires: ["elemsize(n) > 0"]
    modifies: []

  genericslib.Show:
    reason: Test entry for a generic function that calls a method of what it is given, without a claim for its type parameter.
    modifies: []

  genericslib.Bump:
    reason: Test entry for a generic function that calls the method of its constraint.
    modifies: []

  genericslib.Order:
    reason: Test entry for a generic function that calls no method of its type arguments.
    asserts: {S: [], E: []}
    modifies: [s]

  genericslib.Keep:
    reason: Test entry for a generic function of one value.
    asserts: {T: []}
    modifies: []
    ensures: ["fresh(result)"]

  genericslib.Count:
    reason: Test entry that lists types for a type parameter under asserts.
    asserts: {E: [io.Reader]}
    modifies: []
    ensures: ["result = |s|"]

  genericslib.Equal:
    reason: Test entry for a generic function that compares two values.
    asserts: {E: []}
    modifies: []
    ensures: ["result <-> a = b"]

  genericslib.Apply:
    reason: Test entry whose ensures applies the function it is handed.
    runs: [f]
    calls:
      f(e): {}
    asserts: {S: [], E: []}
    modifies: []
    ensures:
      - "result -> |s| > 0"
      - "(|s| > 0 And f(s[0])) -> result"

  genericslib.IsPos:
    reason: Test entry for a generic function used as a value.
    asserts: {T: []}
    modifies: []
    ensures: ["result <-> x > 0"]

  genericslib.Old:
    reason: Test entry whose requires uses old, a defect at every type argument.
    asserts: {E: []}
    requires: ["old(n) > 0"]
    modifies: []

  genericslib.Set:
    reason: Test entry whose modifies names a field of a value of a type parameter.
    asserts: {E: []}
    requires: ["p != nil"]
    modifies: [p.X]

  genericslib.Holds:
    reason: Test entry whose ensures says fresh of a field of a value of a type parameter.
    asserts: {E: []}
    modifies: []
    ensures: ["result -> fresh(x.P)"]

  genericslib.Touch:
    reason: Test entry that claims nothing for its type parameters.
    modifies: []

  generics.Back:
    reason: Test entry for a generic function of the package that calls back into its caller.
    asserts: {E: []}
    modifies: []

  generics.Local:
    reason: Test entry for a generic function of the package that calls it.
    asserts: {E: []}
    modifies: []
    ensures: ["result = x"]

# States of interfaces of another module, and contracts that speak of them.
state:
  ifacestatelib.Conn:
    started:
      reason: True between a Start that returned nil and the next Finish.
  ifacestatelib.Response: # // want `the trust file declares states of ifacestatelib.Response, which is not an interface type; a trust file can declare states only of an interface`
    ready:
      reason: A struct cannot have a state declared in a project file.
  ifacestatelib.Alias: # // want `the trust file declares states of ifacestatelib.Alias, which declares no method of its own`
    gone:
      reason: Declares no method.
  ifacestatelib.Defined: # // want `the trust file declares states of ifacestatelib.Defined, which declares no method of its own`
    gone:
      reason: Defined from Conn, whose methods it has.

