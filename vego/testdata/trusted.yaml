# Trusted contracts for the helper functions of the test corpora. The keys
# use the import paths the packages have under testdata/src.
version: 1

trusted:
  # The guide's entry for os.ReadFile, which TestReadFileEntry checks
  # against the real function on regular files.
  os.ReadFile:
    reason: >-
      This program reads only regular files that it wrote itself, each small
      enough to be read into memory twice over. os.ReadFile returns for
      such a file; it does not for a file that never ends, such as
      /dev/zero, or one larger than can be allocated, so that is what this
      entry claims of every name passed to it. The rest is read from the
      source of os: ReadFile opens the file as os.Open does, reads it with
      (*os.File).Read into new memory, and closes it, so its errors are
      those that the shipped entries of Open and Read vouch for, and its
      result is new memory.
    requires:
      - "|name| < MaxInt"
      - "4 * |name| + 65536 <= MaxAlloc"
    vouches: [result2]
    modifies: []
    ensures:
      - "fresh(result1)"

  unsafelib.Run:
    reason: A test entry for a function that calls through an unsafe.Pointer.
    requires: ["h != nil"]
    modifies: []

  unsafelib.RunListed:
    reason: The same, with the parameter listed under runs.
    requires: ["h != nil"]
    runs: [h]
    modifies: []

  defects.touch:
    reason: Test helper that writes the first element.
    modifies: [A]

  effects.unknown:
    reason: Test helper whose result is deliberately unknown.
    modifies: []

  effects.indirectWrite:
    reason: Test helper that writes through a pointer.
    modifies: [a]

  effects.rangeWrite:
    reason: Test helper that writes in a range clause.
    modifies: [a]

  semantics.scramble:
    reason: Test helper that overwrites every element.
    modifies: [A]

  values.stat:
    reason: Test helper that asks the file system.
    modifies: []

  values.external:
    reason: Test helper standing for a call whose failure cannot be predicted.
    modifies: []

  closures.closeIt:
    reason: Test helper standing for Close, whose error nothing predicts and nobody vouches for.
    modifies: []

  values.outsideNumber:
    reason: Test helper standing for a call whose result cannot be predicted.
    modifies: []

  values.describe:
    reason: Test helper that reads an error.
    runs: [e]
    modifies: []

  values.consume:
    reason: Test helper that reads an error.
    runs: [e]
    modifies: []

  trust.readConfig:
    reason: Stands for reading a file; the contract only says what success means.
    ensures:
      - "err = nil -> size >= 0"
    modifies: []

  trust.parsePort:
    reason: Stands for a parser whose success is determined by its input.
    ensures:
      - "0 <= n <= 65535 -> err = nil"
      - "err = nil -> port = n"
    modifies: []

  trust.fill:
    reason: Stands for an unverifiable function that overwrites its slice.
    modifies: [dst]
    ensures:
      - "Forall k in [0, |dst|) : dst'[k] = value"

  trust.readOnly:
    reason: Stands for an unverifiable function that only reads its slice.
    ensures:
      - "result >= 0"
    modifies: []

  trust.contradictory:
    reason: A contract nobody can satisfy.
    ensures:
      - "result > 0"
      - "result < 0"
    modifies: []

  trust.wrongModifies:
    reason: Lists something that is not a slice parameter.
    modifies: [count]

  trust.wrongName:
    reason: Mentions a name the function does not have.
    ensures:
      - "total >= 0"
    modifies: []

  trust.makesSlice:
    reason: Returns a slice.
    modifies: []

  trust.Verified:
    reason: This function is also annotated in source.
    ensures:
      - "result = 0"
    modifies: []

  sort.IntsAreSorted:
    reason: Project override of a shipped contract, deliberately saying nothing.
    modifies: []

  rejected.unverified:
    reason: Test helper that hands its argument back.
    modifies: []

  trust.usesPredicate:
    reason: Mentions a predicate, which a trusted contract may not.
    ensures:
      - "good(result)"
    modifies: []

  trust.impossibleString:
    reason: Promises a byte value that does not exist.
    ensures:
      - "|result| = 1"
      - "result[0] = 256"
    modifies: []

  trust.take:
    reason: Mentions a parameter of interface type, which a formula can only compare with nil.
    ensures:
      - "result = MaxInt"
    modifies: []

  trust.ready:
    reason: Always succeeds; its first result has a type vego does not model.
    ensures:
      - "err = nil"
    modifies: []

  trust.takeAny:
    reason: Takes old of a parameter of interface type, which a formula can only compare with nil.
    ensures:
      - "result = old(x)"
    modifies: []

  trust.readyWith:
    reason: Succeeds whenever the slice it only reads starts with zero.
    requires:
      - "|a| = 1"
      - "a[0] = 0"
    ensures:
      - "a[0] = 0 -> err = nil"
    modifies: []

  trust.readyWriting:
    reason: Succeeds for a slice of one element, which it may overwrite.
    modifies: [a]
    ensures:
      - "|a'| = 1 -> err = nil"

  trust.readyByte:
    reason: Succeeds whenever its byte result is not negative, which is always.
    ensures:
      - "value >= 0 -> err = nil"
    modifies: []

  trust.maybeSigned:
    reason: Succeeds only when its result is not negative.
    ensures:
      - "value >= 0 -> err = nil"
    modifies: []

  trust.readyAtLeast:
    reason: Succeeds when its byte result is at least n, which it always is for n = 0.
    ensures:
      - "value >= n -> err = nil"
    modifies: []

  trust.readyBytes:
    reason: Succeeds when the first byte it leaves is not negative, which is always.
    modifies: [a]
    requires:
      - "|a| = 1"
    ensures:
      - "a'[0] >= 0 -> err = nil"

  trust.readyNil:
    reason: Succeeds for the nil error it requires.
    requires:
      - "e = nil"
    ensures:
      - "err = nil"
    modifies: []

  trust.readyLinked:
    reason: Returns zero, and succeeds whenever it returns zero.
    ensures:
      - "value = 0"
      - "value = 0 -> err = nil"
    modifies: []

  trust.external:
    reason: Stands for a call whose failure cannot be predicted.
    modifies: []

  trust.writesSixtyFive:
    reason: Writes the first byte and always succeeds.
    modifies: [a]
    requires:
      - "|a| = 65"
    ensures:
      - "a'[0] >= 0 -> err = nil"

  trust.readsSixtyFive:
    reason: Reads its slice and always succeeds.
    requires:
      - "|a| = 65"
    ensures:
      - "a[0] >= 0 -> err = nil"
    modifies: []

  (*memory.Log).Write:
    reason: Test helper standing for a method that appends to its receiver and may fail.
    runs: [l]
    modifies: [l]
    ensures:
      - "err = nil -> l.count' = l.count + 1"
      - "err != nil -> l.count' = l.count"

  (*memory.Log).Count:
    reason: Test helper standing for a method that only reads its receiver.
    runs: [l]
    requires:
      - "l != nil"
    ensures:
      - "result = l.count"
    modifies: []

  memory.newLog:
    reason: Test helper standing for a constructor.
    ensures:
      - "fresh(result) And result.count = 0"
    modifies: []

  memory.grab:
    reason: Test helper whose modifies names something that is not there.
    modifies: [l.missing]

  memory.readySmall:
    reason: Test helper that succeeds when every field holds a value of its type, which is always.
    requires:
      - "|a| = 65"
    ensures:
      - "(Forall k in [0, |a|) : a[k].X >= 0) -> result = nil"
    modifies: []

  memory.readyBlob:
    reason: Test helper that succeeds when the bytes behind its pointer are bytes, which is always.
    requires:
      - "p != nil And |p.B| = 65"
    ensures:
      - "(Forall k in [0, |p.B|) : p.B[k] >= 0) -> result = nil"
    modifies: []

  memory.readyNamed:
    reason: Test helper that succeeds when the bytes of the strings in its elements are bytes, which is always.
    requires:
      - "|a| = 65"
    ensures:
      - "(Forall k in [0, |a|) : Forall j in [0, |a[k].S|) : a[k].S[j] >= 0) -> result = nil"
    modifies: []

  memory.readyRows:
    reason: Test helper that succeeds when the slices in its slice have lengths that are not negative, which is always.
    requires:
      - "|a| = 65"
    ensures:
      - "(Forall k in [0, |a|) : |a[k]| >= 0) -> result = nil"
    modifies: []

  (*invariants.Log).write:
    reason: Test helper standing for an unverified method that changes its receiver.
    modifies: [l]

  mapping.readyBytes:
    reason: Test helper that succeeds when every value of its map is a byte, which is always.
    requires:
      - "|m| = 2"
    ensures:
      - "(Forall k in Z : m[k] >= 0) -> result = nil"
    modifies: []

  trust.claimsNegative:
    reason: Test helper whose promise cannot be true of a positive argument.
    ensures:
      - "n < 0"
    modifies: []

  trust.claimsChange:
    reason: Test helper that describes memory after the call without listing it.
    requires:
      - "|xs| > 0"
    ensures:
      - "xs'[0] = 7"
    modifies: []

  trust.bounce:
    reason: Test helper that calls back into its caller.
    ensures:
      - "result = 0"
    modifies: []

  trust.setThrough:
    reason: Test helper that writes through its first parameter.
    requires:
      - "p != nil And p = q"
    ensures:
      - "q.X' = 1"
    modifies: [p.X]

  trust.nonnegative:
    reason: Test helper whose promise is what the type of a byte guarantees.
    requires:
      - "|s| = 1"
    ensures:
      - "s[0] >= 0"
    modifies: []

  trust.orphan:
    reason: Test helper that clears a pointer field.
    requires:
      - "p != nil"
    ensures:
      - "p.Child' = nil"
    modifies: [p]

  trust.allNonnegative:
    reason: Test helper whose promise is what the type of every byte guarantees.
    requires:
      - "|s| = 1"
    ensures:
      - "Forall k in [0, |s|) : s[k] >= 0"
    modifies: []

  trust.pair:
    reason: Test helper that returns a number and may fail.
    modifies: []

  trust.bytePair:
    reason: Test helper that returns a byte and may fail.
    modifies: []

  trust.alwaysError:
    reason: Test helper that fails for every byte.
    ensures:
      - "b >= 0 -> result != nil"
    modifies: []

  trust.setting:
    reason: Test helper that returns a string from outside, which may be empty.
    modifies: []

  trust.step:
    reason: Test helper that may fail for any argument.
    modifies: []

  trust.bounceByValue:
    reason: Test helper that calls back into its caller through a function value.
    ensures:
      - "result = 0"
    modifies: []

  trust.claimsOtherChange:
    reason: Test helper that lists a struct and describes a slice after the call.
    requires:
      - "|xs| > 0 And p != nil"
    ensures:
      - "xs'[0] = 7"
    modifies: [p]

  trust.bounceByVariable:
    reason: Test helper that calls back into its caller through a variable.
    ensures:
      - "result = 0"
    modifies: []

  trust.finish:
    reason: Test helper that succeeds only where two squares add up to six, which is nowhere.
    runs: [e]
    ensures:
      - "result = nil <-> (e = nil And x*x + y*y = 6)"
    modifies: []

  trust.bounceByField:
    reason: Test helper that calls back into its caller through a field of a variable.
    ensures:
      - "result = 0"
    modifies: []

  trust.claimsOtherSlice:
    reason: Test helper that lists one slice and describes another of the same kind after the call.
    requires:
      - "|xs| > 0 And |ys| > 0"
    ensures:
      - "xs'[0] = 7"
    modifies: [ys]

  trust.setsFirst:
    reason: Test helper that sets the first element of the slice it lists.
    requires:
      - "|xs| > 0"
    ensures:
      - "xs'[0] = 7"
    modifies: [xs]

  trust.bounceByClosure:
    reason: Test helper that calls back into its caller through a function literal kept in a variable.
    ensures:
      - "result = 0"
    modifies: []

  trust.bounceByMethodValue:
    reason: Test helper that calls back into its caller through a method taken from an interface.
    ensures:
      - "result = 0"
    modifies: []

  trust.setsChild:
    reason: Test helper that sets the first element of the slice it lists, which may be a slice inside the other.
    requires:
      - "|xs| = 1 And |ys| = 1 And |xs[0].Children| = 1"
    ensures:
      - "ys'[0].Value = 7"
      - "(|xs[0].Children'| = 1 And xs[0].Children'[0].Value = 7) Or xs[0].Children'[0].Value = xs[0].Children[0].Value"
    modifies: [ys]

  trust.claimsOtherCell:
    reason: Test helper that lists one slice of structs and describes a field in another after the call.
    requires:
      - "|xs| > 0 And |ys| > 0"
    ensures:
      - "xs'[0].X = 7"
    modifies: [ys]

  trust.bounceByRange:
    reason: Test helper that calls back into its caller by ranging over a function kept in a variable.
    ensures:
      - "result = 0"
    modifies: []

  trust.bounceByGeneric:
    reason: Test helper that calls back into its caller through a generic function that ranges over its argument.
    ensures:
      - "result = 0"
    modifies: []

  trust.tell:
    reason: Test helper that is given an error and does not say that it runs its methods.
    modifies: []

  trust.tellAny:
    reason: Test helper that vouches for the methods of the error it is given.
    runs: [e]
    modifies: []

  (*trust.sinkHolder).flush:
    reason: Test helper on a struct that holds a function, which it does not say it runs.
    modifies: []

  (*trust.sinkHolder).flushRuns:
    reason: Test helper that vouches for the function its receiver holds.
    runs: [s]
    modifies: []

  trust.runsNothing:
    reason: Test helper whose runs lists something that can hold no code.
    runs: [x]
    modifies: []

  trust.runsNobody:
    reason: Test helper whose runs lists a name that is no parameter.
    runs: [y]
    modifies: []

  wrapped.tell:
    reason: Test helper that is given an error and does not say that it runs its methods.
    modifies: []

  (*trust.pinged).ping:
    reason: Test helper that does nothing.
    modifies: []

  trust.twoPlain:
    reason: Test helper with two unnamed results.
    modifies: []
    ensures:
      - "result2 = nil -> result1 >= 0"

  trust.secondNamed:
    reason: Test helper that names its first result result2 and leaves the second blank.
    modifies: []
    ensures:
      - "result2 = 0"

  trust.clash:
    reason: Test helper whose parameter is called like its unnamed result.
    modifies: []
    ensures:
      - "result = 7"

  # Contracts that vouch for the errors their functions return; see the
  # vouched corpus.
  vouched.next:
    reason: Test helper that returns io.EOF at the end of s and nothing else.
    requires: ["0 <= i"]
    vouches: [err]
    modifies: []
    ensures:
      - "err = nil <-> i < |s|"
      - "err != nil -> err = io.EOF"
      - "err = nil -> b = s[i]"

  vouched.nextUnvouched:
    reason: The same helper, without the claim about its errors.
    requires: ["0 <= i"]
    modifies: []
    ensures:
      - "err = nil <-> i < |s|"
      - "err != nil -> err = io.EOF"
      - "err = nil -> b = s[i]"

  vouched.open:
    reason: Test helper that fails with a *fs.PathError wrapping fs.ErrNotExist for an empty name.
    vouches: [err]
    modifies: []
    ensures:
      - 'err = nil <-> name != ""'
      - 'err != nil -> is(err, "io/fs".ErrNotExist)'

  vouched.two:
    reason: Test helper with two error results, of which it vouches for the second.
    vouches: [b]
    modifies: []

  vouched.log:
    reason: Test helper that takes an error and does nothing with it.
    modifies: []

  vouched.hidden:
    reason: Test helper that returns an unexported error variable of its package.
    vouches: [err]
    modifies: []
    ensures:
      - "err = errHidden"

  vouched.late:
    reason: Test helper that returns context.DeadlineExceeded.
    vouches: [err]
    modifies: []
    ensures:
      - "err = context.DeadlineExceeded"

  vouched.vouchesParam:
    reason: Lists a parameter under vouches.
    vouches: [e]
    modifies: []

  vouched.vouchesInt:
    reason: Lists a result that is not an error.
    vouches: [n]
    modifies: []

  vouched.vouchesTwice:
    reason: Lists a result twice.
    vouches: [err, err]
    modifies: []

  vouched.vouchesUnknown:
    reason: Lists a name the function does not have.
    vouches: [failure]
    modifies: []

  vouched.namesQuotedShort:
    reason: Names io.EOF in quotes.
    vouches: [err]
    modifies: []
    ensures:
      - 'err = "io".EOF'

  vouched.namesMissingPackage:
    reason: Names a package that is not in the build.
    vouches: [err]
    modifies: []
    ensures:
      - 'err = "example.com/none".ErrNone'

  vouched.namesMissingVariable:
    reason: Names a variable that io does not have.
    vouches: [err]
    modifies: []
    ensures:
      - "err = io.ErrNone"

  vouched.lib.Fail:
    reason: Test helper that fails with ErrBad of its own package for a negative n.
    vouches: [err]
    modifies: []
    ensures:
      - "err = nil <-> n >= 0"
      - "err != nil -> err = ErrBad"

  vouched.lib.FailQuoted:
    reason: The same, naming ErrBad by the path of its package, which has a dot.
    vouches: [err]
    modifies: []
    ensures:
      - "err = nil <-> n >= 0"
      - 'err != nil -> err = "vouched.lib".ErrBad'

  vouched.lib.End:
    reason: Test helper that returns io.EOF.
    vouches: [err]
    modifies: []
    ensures:
      - "err = io.EOF"

  funcvalues.loadMapper:
    reason: Test helper that hands back a mapper and claims nothing about it.
    modifies: []
    ensures: ["m != nil"]

  funcvalues.loadMapperVouched:
    reason: Test helper that hands back a mapper made by verified code.
    vouches: [m]
    modifies: []
    ensures: ["m != nil"]

  (*funcvalues.Chain).grow:
    reason: Test helper that may hang a new link with a mapper on a chain.
    modifies: [c]

  funcvalues.loadUnnamed:
    reason: Test helper that hands back a mapper in an unnamed result.
    modifies: []

  funcvalues.fire:
    reason: Test helper that calls a hook that unverified code sets.
    modifies: []

  funcvalues.logErr:
    reason: Test helper that is given an error and does not say it runs it.
    modifies: []

  keeper.Keep:
    reason: >-
      Test helper. Its entry is false: runs claims that Keep keeps no value
      that can hold code once it returns, and Keep keeps e for Flush.
    runs: [e]
    modifies: []

  keeper.KeepUnlisted:
    reason: Test helper that keeps the error it is given.
    modifies: []

  keeper.Flush:
    reason: Test helper that runs a method of the kept error.
    modifies: []

  callbacks.each:
    reason: Test helper that calls f with each number below n.
    runs: [f]
    calls:
      f(i):
        requires: ["0 <= i < n"]
    modifies: []

  callbacks.notRun:
    reason: Test helper whose calls gives f a contract that runs does not list.
    calls:
      f(i): {}
    modifies: []

  callbacks.notFunc:
    reason: Test helper whose calls lists a number.
    runs: [f]
    calls:
      f(i): {}
    modifies: []

  callbacks.twice:
    reason: Test helper whose calls lists f twice.
    runs: [f]
    calls:
      f(i): {}
      f(j): {}
    modifies: []

  callbacks.wrongCount:
    reason: Test helper whose calls names too few parameters.
    runs: [f]
    calls:
      f(i): {}
    modifies: []

  callbacks.sameName:
    reason: Test helper whose calls names one parameter twice.
    runs: [f]
    calls:
      f(i, i): {}
    modifies: []

  callbacks.clash:
    reason: Test helper whose calls names a parameter after one of the function.
    runs: [f]
    calls:
      f(n): {}
    modifies: []

  callbacks.clashResult:
    reason: Test helper whose calls names a parameter after a result of the function.
    runs: [f]
    calls:
      f(k): {}
    modifies: []

  callbacks.reserved:
    reason: Test helper whose calls names a parameter result.
    runs: [f]
    calls:
      f(result): {}
    modifies: []

  callbacks.badRequires:
    reason: Test helper whose calls requires names nothing that exists.
    runs: [f]
    calls:
      f(i):
        requires: ["0 <= i < m"]
    modifies: []

  callbacks.primed:
    reason: Test helper whose calls requires is primed.
    runs: [f]
    calls:
      f(i):
        requires: ["xs'[i] > 0"]
    modifies: []

  callbacks.takesError:
    reason: Test helper that calls f with an error.
