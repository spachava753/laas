# Trusted contracts for the helper functions of the test corpora. The keys
# use the import paths the packages have under testdata/src.
version: 1

trusted:
  # F43, F6 of the review of the design: a contract for the tests only.
  (*strings.Replacer).Replace:
    reason: A test helper; it returns a string and writes nothing a caller sees.
    requires: ["r != nil"]
    modifies: []
  # F43, F14 of the review of step 1: trusted functions handed a value that
  # code which is not verified made, whose method calls an ambient function.
  cycles/held/tv2lib.Run:
    reason: A probe; it calls M of x and nothing else.
    requires: ["x != nil"]
    modifies: []
    runs: [x]
    asserts: {x: []}
  cycles/held/tv2lib.Run2:
    reason: A probe; it calls M of x.
    requires: ["x != nil"]
    modifies: []
    runs: [x]
  # F43, F8 of the review of step 0: a trusted function that calls N of
  # what it is handed, which a verified wrapper hands what it wraps.
  cycles/held/t1lib.Run:
    reason: A probe; it calls N of x and nothing else.
    requires: ["x != nil"]
    modifies: []
    runs: [x]
    asserts: {x: []}
  # F43, F9 of the review of step 0: trusted functions that return a hook
  # they kept from an earlier call.
  cycles/held/t3lib.Current:
    reason: A probe; it returns what Set kept, which meets the contract of Hook.
    modifies: []
    vouches: [result]
  cycles/held/sibtlib.Current:
    reason: A probe; it returns what Set kept, which meets the contract of Hook.
    modifies: []
    vouches: [result]
  # F43, F2 of the review of the design: a trusted function of the
  # package that hands what it is given to slices.SortFunc.
  cycles/held/sort.Sort:
    reason: Sorts xs with c.
    requires: ["c != nil"]
    modifies: [xs]
    runs: [c]
  # F40, F22 of the review of step 2: a function that writes one entry of a
  # map and runs what it is handed.
  sourcecalls.setWith:
    reason: Sets m[k] to v, then calls f once.
    requires: ["m != nil"]
    runs: [f]
    calls:
      f(): {}
    modifies: ["m[k]"]
    ensures: ["has(m', k) And m'[k] = v"]
  # F40, step 1b: a function that returns new memory holding a reference to
  # more new memory, whose regions the call does not list; what memory held
  # on entry refers to says nothing of it.
  recclosures.makeChain:
    reason: Returns a new holder whose next is another new holder.
    modifies: []
    ensures: ["p != nil", "fresh(p)", "p.next != nil", "fresh(p.next)"]
  # F39, part A: functions of unseensdk, which run methods of the SDK that
  # nobody verified. Each entry answers for what the methods it runs do.
  unseensdk.Send:
    reason: >-
      Encodes r with encoding/json, which runs the MarshalJSON of each
      content; those of unseensdk read the text and write nothing.
    requires: ["r != nil"]
    runs: [r]
    asserts: {r: []}
    modifies: []
    ensures: ["True"]
  unseensdk.Run:
    reason: Runs b.Bump, which writes what b holds, its footprint.
    requires: ["b != nil"]
    runs: [b]
    asserts: {b: []}
    modifies: [b]
    ensures: ["True"]
  unseensdk.WrapIO:
    reason: >-
      Keeps b in a writer whose Write runs b.Bump, which writes the
      footprint of b.
    requires: ["b != nil"]
    runs: [b]
    keeps:
      b: [result]
    asserts:
      b: []
    vouches: [result]
    modifies: []
    ensures: ["result != nil", "fresh(result, b)"]
  unseensdk.KHook:
    reason: A hook of the corpus, called with a count that is not negative.
    requires: ["k >= 0"]
    modifies: []
    ensures: ["True"]
  unseensdk.FireAll:
    reason: Runs f.Fire, which reads what f holds.
    requires: ["f != nil"]
    runs: [f]
    asserts: {f: []}
    modifies: []
    ensures: ["True"]
  unseensdk.Fill:
    reason: Runs s.Put, which writes what s holds.
    requires: ["s != nil"]
    runs: [s]
    asserts: {s: []}
    modifies: [s]
    ensures: ["True"]
  arraystructs.setLast:
    reason: Test helper standing for a trusted function that writes the last element of an array field (F16 of the review of S2 of F36).
    requires:
      - "b != nil"
    modifies: [b.out]
  arraystructs.setInnerTrusted:
    reason: Test helper standing for a trusted function that writes the array of a struct held in a field.
    requires:
      - "o != nil"
    modifies: [o.in]
  arraystructs.setElementTrusted:
    reason: Test helper standing for a trusted function that writes the array of an element of a slice of structs.
    requires:
      - "0 <= i < |bs|"
    modifies: ["bs[i]"]
  handlers.trailerOf:
    reason: Test helper standing for a trusted function that returns the trailer of a request, which verified code cannot name.
    requires:
      - "r != nil"
    runs: [r]
    asserts:
      r: []
    modifies: []

  handlers.fillPage:
    reason: Test helper that sets a header of h, listed under stores, and writes p, which stores does not list.
    requires:
      - "h != nil And p != nil"
    modifies: [h, p]
    stores: [h]

  handlers.wrapW:
    reason: Test helper that keeps the writer it is given in its result.
    requires:
      - "w != nil"
    runs: [w]
    keeps:
      w: [r]
    vouches: [r]
    modifies: []

  handlers.get:
    reason: Test helper standing for a trusted function that makes a request and returns its response, of which nothing places the body.
    vouches: [resp]
    modifies: []

  handlers.tallyOf:
    reason: Test helper that returns a tally of no known origin.
    modifies: []
    ensures:
      - "t != nil"

  handlers.grownBeside:
    reason: Test helper that sets a header of h, which it lists under stores, writes s, and returns a map in the footprint of s.
    requires:
      - "h != nil And s != nil"
    runs: [s]
    modifies: [h, s]
    stores: [h]
    vouches: [s]
    ensures:
      - "m != nil And within(m, s)"

  # The guide's entry for os.ReadFile, which TestReadFileEntry checks
  # against the real function on regular files.
  os.ReadFile:
    reason: >-
      This program reads only regular files that it wrote itself, each small
      enough to be read into memory twice over. os.ReadFile returns for
      such a file; it does not for a file that never ends, such as
      /dev/zero, or one larger than can be allocated, so that is what this
      entry claims of every name passed to it. The rest is read from the
      source of os: ReadFile opens the file as os.Open does, reads it with
      (*os.File).Read into new memory, and closes it, so its errors are
      those that the shipped entries of Open and Read vouch for, and its
      result is new memory.
    requires:
      - "|name| < MaxInt"
      - "4 * |name| + 65536 <= MaxAlloc"
    vouches: [result2]
    modifies: []
    ensures:
      - "fresh(result1)"

  unsafelib.Run:
    reason: A test entry for a function that calls through an unsafe.Pointer.
    requires: ["h != nil"]
    modifies: []

  unsafelib.RunListed:
    reason: The same, with the parameter listed under runs.
    requires: ["h != nil"]
    runs: [h]
    modifies: []

  defects.touch:
    reason: Test helper that writes the first element.
    modifies: [A]

  effects.unknown:
    reason: Test helper whose result is deliberately unknown.
    modifies: []

  effects.indirectWrite:
    reason: Test helper that writes through a pointer.
    modifies: [a]

  effects.rangeWrite:
    reason: Test helper that writes in a range clause.
    modifies: [a]

  mapping.twoKeys:
    reason: Test helper whose entry promises a map no map can be, with one key counted and two present.
    modifies: []
    ensures:
      - "|result| = 1 And has(result, 1) And has(result, 2)"

  mapping.setEntry:
    reason: Test helper that sets one entry of a map.
    requires:
      - "m != nil"
    modifies: ["m[k]"]
    ensures:
      - "has(m', k) And m'[k] = v"

  semantics.scramble:
    reason: Test helper that overwrites every element.
    modifies: [A]

  values.stat:
    reason: Test helper that asks the file system.
    modifies: []

  values.external:
    reason: Test helper standing for a call whose failure cannot be predicted.
    modifies: []

  closures.closeIt:
    reason: Test helper standing for Close, whose error nothing predicts and nobody vouches for.
    modifies: []

  values.outsideNumber:
    reason: Test helper standing for a call whose result cannot be predicted.
    modifies: []

  values.describe:
    reason: Test helper that reads an error.
    runs: [e]
    modifies: []

  values.consume:
    reason: Test helper that reads an error.
    runs: [e]
    modifies: []

  trust.readConfig:
    reason: Stands for reading a file; the contract only says what success means.
    ensures:
      - "err = nil -> size >= 0"
    modifies: []

  trust.parsePort:
    reason: Stands for a parser whose success is determined by its input.
    ensures:
      - "0 <= n <= 65535 -> err = nil"
      - "err = nil -> port = n"
    modifies: []

  trust.fill:
    reason: Stands for an unverifiable function that overwrites its slice.
    modifies: [dst]
    ensures:
      - "Forall k in [0, |dst|) : dst'[k] = value"

  trust.readOnly:
    reason: Stands for an unverifiable function that only reads its slice.
    ensures:
      - "result >= 0"
    modifies: []

  trust.contradictory:
    reason: A contract nobody can satisfy.
    ensures:
      - "result > 0"
      - "result < 0"
    modifies: []

  trust.wrongModifies:
    reason: Lists something that is not a slice parameter.
    modifies: [count]

  trust.wrongName:
    reason: Mentions a name the function does not have.
    ensures:
      - "total >= 0"
    modifies: []

  trust.makesSlice:
    reason: Returns a slice.
    modifies: []

  trust.Verified:
    reason: This function is also annotated in source.
    ensures:
