  generics.Back:
    reason: Test entry for a generic function of the package that calls back into its caller.
    asserts: {E: []}
    modifies: []

  generics.Local:
    reason: Test entry for a generic function of the package that calls it.
    asserts: {E: []}
    modifies: []
    ensures: ["result = x"]

  jsondec.ownUnmarshal:
    reason: A wrapper of json.Unmarshal; only shipped entries may list decodes.
    decodes: [v]
    vouches: [result]
    modifies: []

  jsonenc.ownMarshal:
    reason: A wrapper of json.Marshal; only shipped entries may list encodes.
    encodes: [v]
    vouches: [result2]
    modifies: []

  frames.each:
    reason: Test helper that calls f with each number below n.
    runs: [f]
    calls:
      f(i):
        requires: ["0 <= i < n"]
    modifies: []

  trustedwrites.Tick:
    reason: Test helper whose entry is false on purpose; bump assigns Ticks.
    modifies: []

  trustedwrites.TickListed:
    reason: Test helper that assigns Ticks, which the entry lists.
    modifies: [Ticks]

  trustedwrites.TickState:
    reason: Test helper that assigns Ticks, which the state of its package covers.
    modifies: ['"trustedwrites"']

  trustedwrites.Poke:
    reason: Test helper whose entry is false on purpose; it writes Table[0].
    modifies: []

  trustedwrites.TickHook:
    reason: Test helper whose entry is false on purpose; its hook writes Ticks.
    modifies: []

  trustedwrites.Apply:
    reason: Test helper that runs f once and writes nothing itself.
    runs: [f]
    calls:
      f(k):
        requires: ["True"]
    modifies: []

  letoutq.current:
    reason: Test helper that returns the package's box.
    vouches: [b]
    modifies: []

  letoutq.Slot:
    reason: Test helper that returns the package's box.
    vouches: [b]
    modifies: []

  closedq.Show:
    reason: Test helper that hands v to a method of x; it writes only what x reaches, and its entry says nothing of the code x carries.
    modifies: [x]

  closedq.Run:
    reason: Test helper that hands v to a method of x; it writes only what x reaches.
    modifies: [x]

  closedq.Poke:
    reason: Test helper that writes to v when it is a writer; it runs none of the code v carries by its entry, which says nothing of it.
    modifies: [v]

  isolatedq.Hand:
    reason: Test helper that runs what b holds, and nothing else.
    requires: ["b != nil"]
    runs: [b]
    isolated: true
    modifies: []

  isolatedq.Look:
    reason: Test helper that reads b and runs nothing.
    requires: ["b != nil"]
    isolated: true
    modifies: []

  hiddenlookq.Look:
    reason: Test helper that calls Init of x when it has one, and writes nothing a caller can see; its entry says nothing of the code x carries.
    modifies: []

  typederrors.consume:
    reason: Test helper that runs the code an error holds; it stands for a trusted function to which the conversions of typederrors/unchecked.go would hand code nobody checked. It asserts e to HeldAny and heldHidden and what they hold to an interface with Bump, which asserts declares, as it may over an error.
    runs: [e]
    asserts:
      e: [typederrors.HeldAny, typederrors.heldHidden, "interface{ Bump() }"]
    modifies: []

  guide.use:
    reason: The guide's example of a trusted function that asserts what it is handed to an interface that the parameter's type does not have.
    runs: [p]
    asserts:
      p: ["interface{ Bump() }"]
    modifies: []

  runsclaims.use:
    reason: Test helper whose entry is false, kept to show what such an entry lets through; use asserts p to an interface with Bump and calls it, which an entry without asserts for p says it does not.
    runs: [p]
    modifies: []

  runsclaims.useBump:
    reason: Test helper that asserts p to an interface with Bump and calls it, as its asserts says, which is a defect.
    runs: [p]
    asserts:
      p: ["interface{ Bump() }"]
    modifies: []

  runsclaims.useShut:
    reason: Test helper that asserts p to Shutter and calls Shut, as its asserts says, which is a defect.
    runs: [p]
    asserts:
      p: [runsclaims.Shutter]
    modifies: []

  runsclaims.usePing:
    reason: Test helper that asserts p to an interface with Ping and calls it.
    runs: [p]
    asserts:
      p: ["interface{ Ping() }"]
    modifies: []

  runsclaims.consumeAny:
    reason: Test helper that asserts x to error and calls Error, as its asserts says, which is a defect.
    runs: [x]
    asserts:
      x: [error]
    modifies: []

  runsclaims.consumeErr:
    reason: Test helper that asserts e to PingErr and what it holds to an interface with Bump, and calls Bump.
    runs: [e]
    asserts:
      e: [runsclaims.PingErr, "interface{ Bump() }"]
    modifies: []

  runsclaims.useHolder:
    reason: Test helper that asserts what h holds to an interface with Ping and calls it.
    runs: [h]
    asserts:
      h: ["interface{ Ping() }"]
    modifies: []

  runsclaims.useHook:
    reason: Test helper that asserts p to Hook and calls it, as its asserts says, which is a defect.
    runs: [p]
    asserts:
      p: [runsclaims.Hook]
    modifies: []

  runsclaims.useTwo:
    reason: Test helper that asserts what h holds to an interface with Ping and calls it, as its asserts says, which is a defect.
    runs: [h]
    asserts:
      h: ["interface{ Ping() }"]
    modifies: []

  runsclaims.useNext:
    reason: Test helper that asserts what p's Next returns to an interface with Ping and calls it, as its asserts says, which is a defect.
    runs: [p]
    asserts:
      p: ["interface{ Ping() }"]
    modifies: []

  runsclaims.consumeLatch:
    reason: Test helper that asserts e to Latcher, and what Latch returns to one with Ping, and calls it.
    runs: [e]
    asserts:
      e: [runsclaims.Latcher, "interface{ Ping() }"]
    modifies: []

  runsclaims.isTimeout:
    reason: Test helper that asserts err to an interface with Timeout and calls it.
    runs: [err]
    asserts:
      err: ["interface{ Timeout() bool }"]
    modifies: []

  typederrorsbad.wrapRunes:
    reason: Test helper whose entry reads runes as bytes, which Go encodes as UTF-8 (F16 of the review of S2 of F33).
    ensures:
      - "err = SErr(rs)"
    modifies: []

  typederrorsbad.two:
    reason: Test helper whose entry says the error is two errors at once.
    ensures:
      - "err = Error(1) And err = Error(2)"
    modifies: []

  typederrorsbad.big:
    reason: Test helper whose entry says a byte error holds 300.
    ensures:
      - "holds(err, B) And err.(B) = 300"
    modifies: []

  typederrorsbad.wide:
    reason: Test helper whose entry converts an int to a byte error.
    ensures:
      - "err = InvalidByteError(n)"
    modifies: []

  typedowns.fail:
    reason: Test helper standing for a call on what a struct owns, whose error may hold it.
    modifies: []

  ptrstates.newTrustedP:
    reason: Test helper standing for a trusted constructor of a closer of the project, which returns a new one that nobody has closed (O1 of the checkpoint of S0b of F34).
    modifies: []
    ensures:
      - "result != nil And fresh(result) And ~closed(result)"

  (*ptrlib.Quiet).Close:
    reason: Test helper for a library type whose Close has an entry that lists nothing, so the states of what its pointer points to are not kept (F12 of the review of S0b of F34).
    modifies: []

  (*ptrlib.Conn).Close:
    reason: Test helper for a library type whose Close closes the file it holds in an exported field, so the states of a connection are about that file (F10 of the design review of S0b of F34).
    modifies: [c]

  typederrorspos.handsSizer:
    reason: Test helper whose error holds a Sizer that code which is not verified made, whose Size returns -1; its entry vouches for nothing (F8 of the review of S0 of F34).
    modifies: []

  typederrorspos.handsMap:
    reason: Test helper whose error holds Pos values in a map that code which is not verified made; its entry vouches for nothing (F8 of the review of S0 of F34).
    modifies: []

  typederrorspos.handsPosFunc:
    reason: Test helper whose error is a PosFunc that code which is not verified made; its entry vouches for nothing (F9 of the review of S0 of F34).
    modifies: []

  typederrorspos.handsPos:
    reason: Test helper standing for a trusted function whose error holds a function value with a contract that code which is not verified made; its entry vouches for nothing (S0 of F34).
    modifies: []

  typederrorsclient.wrapped:
    reason: Test helper that returns a typederrors.Wrap, whose methods are those of the *PE it embeds.
    ensures:
      - 'holds(err, "typederrors".Wrap)'
    modifies: []
    vouches: [err]

  typederrorsclient.find:
    reason: Test helper standing for a trusted function that returns a typed error, whose entry names the type by the path of its package.
    ensures:
      - "result = nil <-> n >= 0"
      - 'n < 0 -> holds(result, *"typederrors".PE) And result.(*"typederrors".PE).Line = n'
    modifies: []

  exitslib.Stop:
    reason: It calls os.Exit(1).
    exits: true
    modifies: []
    ensures:
      - "False"

  exitslib.MayStop:
    reason: It calls os.Exit(1) for a negative n and returns n otherwise.
    exits: true
    modifies: []
    ensures:
      - "result = n And n >= 0"

  exitslib.Both:
    reason: A contradiction beside False.
    exits: true
    modifies: []
    ensures:
      - "False"
      - "result = 1"

  exitslib.FalseOnly:
    reason: False without exits.
    modifies: []
    ensures:
      - "False"

  (*exitslib.T).Halt:
    reason: It calls os.Exit(1).
    exits: true
    modifies: []
    ensures:
      - "False"

  ownstorage.nest:
    reason: Test helper whose result holds what it is handed below its top level, which its entry does not place.
    modifies: []

  exitslib.ExitCode:
    reason: It calls os.Exit with a code that is not 0 (A7 of the review of step 1 of F37).
    exits: true
    requires:
      - "code != 0"
    modifies: []
    ensures:
      - "False"

  exitslib.ExitNever:
    reason: Requires that contradict each other beside exits.
    exits: true
    requires:
      - "code > 0"
      - "code < 0"
    modifies: []
    ensures:
      - "False"

  ownstorage.project:
    reason: Test helper whose result points into the first element of what it is handed; A10 of the adversarial review of F37.
    requires:
      - "|xs| > 0"
    ensures:
      - "fresh(result) And |result| = 1"
    modifies: []

  ownstorage.wrap:
    reason: Test helper whose result holds what it is handed; A11 of the adversarial review of F37.
    ensures:
      - "fresh(result) And |result| = 1"
    modifies: []

  ptrvals.bumpTrusted:
    reason: Test helper that increments what p points to (F19 of the review of step 2 of F37).
    requires:
      - "p != nil"
      - "*p < 1000"
    modifies: [p]
    ensures:
      - "*p' = *p + 1"

  ptrvalsbad.bumpOther:
    reason: An entry that describes what p points to after the call, which its modifies does not list.
    requires:
      - "p != nil"
    modifies: []
    ensures:
      - "*p' = *p + 1"

# States of interfaces of another module, and contracts that speak of them.
state:
  unseensdk.Shutter:
    latched:
      reason: True once Shut has been called on the value.
  optionalwc.WC:
    ended:
      reason: True once Close has been called on the value.
  ifacestatelib.Conn:
    started:
      reason: True between a Start that returned nil and the next Finish.
  ifacestatelib.Response: # // want `the trust file declares states of ifacestatelib.Response, which is not an interface type; a trust file can declare states only of an interface`
    ready:
      reason: A struct cannot have a state declared in a project file.
  ifacestatelib.Alias: # // want `the trust file declares states of ifacestatelib.Alias, which declares no method of its own`
    gone:
      reason: Declares no method.
  ifacestatelib.Defined: # // want `the trust file declares states of ifacestatelib.Defined, which declares no method of its own`
    gone:
      reason: Defined from Conn, whose methods it has.


