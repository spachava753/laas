version: 1

state:
  io.Closer:
    closed:
      reason: >-
        True once Close has been called on the value, by any code, whatever
        Close returned. The documentation of io.Closer says that the
        behaviour of Close after the first call is undefined, so a second
        Close is ruled out by the entry for Close, which requires that the
        value is not closed. Declaring the state also claims that every
        method of a value with it whose contract does not list the receiver
        leaves it unchanged: Read of io.Reader and Write of io.Writer, on an
        io.ReadCloser, an io.WriteCloser, or an io.ReadWriteCloser, never
        close the value. The documentation does not say that, and it goes
        beyond it; the shipped implementations were tested for it.

trusted:
  (io.Writer).Write:
    reason: >-
      A claim about every io.Writer that verified code gets from code that
      is not verified, other than from a trusted function, whose own
      vouches covers what it returns. The documentation of io.Writer states it for every
      implementation: Write returns the number of bytes written from p,
      0 <= n <= len(p), returns a non-nil error if n < len(p), and must not
      modify the slice data, even temporarily. These are obligations on the
      implementer, which the standard library itself checks in places
      (io.Copy maps a count outside them to an error). Like every entry, it
      also claims that Write returns: a Write on a pipe or a connection
      returns only when it can go on. Nothing is claimed of the errors: an
      implementation may return any error.
    modifies: []
    ensures:
      - "0 <= n And n <= |p|"
      - "n < |p| -> err != nil"

  (io.Reader).Read:
    reason: >-
      A claim about every io.Reader that verified code gets from code that
      is not verified, other than from a trusted function, whose own
      vouches covers what it returns. The documentation of io.Reader states it for every
      implementation: Read reads up to len(p) bytes into p and returns the
      number of bytes read, 0 <= n <= len(p), and may use all of p as
      scratch space during the call. This is an obligation on the
      implementer, which the standard library itself checks in places
      (bufio panics on a negative count). Like every entry, it also claims
      that Read returns, which is the claim real readers break most: a Read
      on a pipe, a terminal, or a connection returns only when data or an
      error arrives, and a reader that never makes progress, such as
      iotest.DataErrReader over a reader that returns 0 bytes and no error,
      never returns. A proof that its caller ends assumes that Read does.
      For an empty p the documentation says only that Read should return 0,
      and iotest.DataErrReader never returns from such a call while it holds
      data, so p must not be empty. Nothing is claimed of the errors: an
      implementation may return any error, not only io.EOF.
    requires:
      - "|p| > 0"
    modifies: [p]
    ensures:
      - "0 <= n And n <= |p|"

  (io.Closer).Close:
    reason: >-
      A claim about every io.Closer that verified code gets from code that
      is not verified, other than from a trusted function, whose own vouches
      covers what it returns. The documentation of io.Closer says only that
      the behaviour of Close after the first call is undefined, and that
      specific implementations may document their own behaviour. So the
      entry requires that the value has not been closed, and claims that a
      first Close returns without panicking and changes nothing verified
      code can see but the states of the value, after which it is closed.
      Like every entry, it also claims that Close returns: a Close that
      flushes to a connection returns only when it can go on. Nothing is
      claimed of the error: an implementation may return any error, also
      from a first Close.
    receiver: c
    requires:
      - "~closed(c)"
    modifies: [c]
    ensures:
      - "closed(c')"
