version: 1

state:
  io.Closer:
    closed:
      reason: >-
        True once Close has been called on the value, by any code, whatever
        Close returned. The documentation of io.Closer says that the
        behaviour of Close after the first call is undefined, so a second
        Close is ruled out by the entry for Close, which requires that the
        value is not closed. Declaring the state also claims that every
        method of a value with it whose contract does not list the receiver
        leaves it unchanged: Read of io.Reader and Write of io.Writer, on an
        io.ReadCloser, an io.WriteCloser, or an io.ReadWriteCloser, never
        close the value. The documentation does not say that, and it goes
        beyond it; the shipped implementations were tested for it.

trusted:
  (io.Writer).Write:
    reason: >-
      A claim about every io.Writer that verified code gets from code that
      is not verified, other than from a trusted function, whose own
      vouches covers what it returns. The documentation of io.Writer states it for every
      implementation: Write returns the number of bytes written from p,
      0 <= n <= len(p), returns a non-nil error if n < len(p), and must not
      modify the slice data, even temporarily. These are obligations on the
      implementer, which the standard library itself checks in places
      (io.Copy maps a count outside them to an error). Like every entry, it
      also claims that Write returns: a Write on a pipe or a connection
      returns only when it can go on. Nothing is claimed of the errors: an
      implementation may return any error.
    modifies: []
    ensures:
      - "0 <= n And n <= |p|"
      - "n < |p| -> err != nil"

  (io.Reader).Read:
    reason: >-
      A claim about every io.Reader that verified code gets from code that
      is not verified, other than from a trusted function, whose own
      vouches covers what it returns. The documentation of io.Reader states it for every
      implementation: Read reads up to len(p) bytes into p and returns the
      number of bytes read, 0 <= n <= len(p), and may use all of p as
      scratch space during the call. This is an obligation on the
      implementer, which the standard library itself checks in places
      (bufio panics on a negative count). Like every entry, it also claims
      that Read returns, which is the claim real readers break most: a Read
      on a pipe, a terminal, or a connection returns only when data or an
      error arrives, and a reader that never makes progress, such as
      iotest.DataErrReader over a reader that returns 0 bytes and no error,
      never returns. A proof that its caller ends assumes that Read does.
      For an empty p the documentation says only that Read should return 0,
      and iotest.DataErrReader never returns from such a call while it holds
      data, so p must not be empty. Nothing is claimed of the errors: an
      implementation may return any error, not only io.EOF.
    requires:
      - "|p| > 0"
    modifies: [p]
    ensures:
      - "0 <= n And n <= |p|"

  (io.Closer).Close:
    reason: >-
      A claim about every io.Closer that verified code gets from code that
      is not verified, other than from a trusted function, whose own vouches
      covers what it returns. The documentation of io.Closer says only that
      the behaviour of Close after the first call is undefined, and that
      specific implementations may document their own behaviour. So the
      entry requires that the value has not been closed, and claims that a
      first Close returns without panicking and changes nothing verified
      code can see but the states of the value, after which it is closed.
      Like every entry, it also claims that Close returns: a Close that
      flushes to a connection returns only when it can go on. Nothing is
      claimed of the error: an implementation may return any error, also
      from a first Close.
    receiver: c
    requires:
      - "~closed(c)"
    modifies: [c]
    ensures:
      - "closed(c')"

  # Functions that keep the readers and writers they are given. What was
  # read in io.go and multi.go of Go 1.27.3: each stores what it is given in
  # the value it returns (MultiReader and MultiWriter copy the slice). The
  # methods of that value read it again only while they are called: Read,
  # Write, and Close, and also the WriteTo of a NopCloser of an io.WriterTo
  # and of a MultiReader, and the WriteString of a MultiWriter, which have
  # no entry. No goroutine, timer, finalizer, cleanup, callback, or
  # package-level variable reaches it. The Read and Write of the values
  # returned call only Read and Write of what they keep. NopCloser asserts r
  # to io.WriterTo and calls nothing.
  io.NopCloser:
    reason: >-
      Documented: "NopCloser returns a ReadCloser with a no-op Close method
      wrapping the provided Reader r." Its Read is r's, and its Close
      returns nil and does nothing, so closing it closes nothing of r. The
      value it returns is a new one, which nobody has closed.
    requires:
      - "r != nil"
    keeps:
      r: [result]
    modifies: []
    # Read from the source of Go 1.27: NopCloser asserts r to WriterTo, and its result has a WriteTo that calls r.WriteTo.
    asserts:
      r: [io.WriterTo]
    vouches: [result]
    ensures:
      - "result != nil"
      - "fresh(result)"
      - "~closed(result)"

  io.LimitReader:
    reason: >-
      Documented: "LimitReader returns a Reader that reads from r but stops
      with EOF after n bytes." Its Read calls r.Read with a part of p that
      is not empty, or returns EOF, so it meets the entry of (io.Reader).Read
      whenever r does.
    requires:
      - "r != nil"
    keeps:
      r: [result]
    modifies: []
    # Read from the source of Go 1.27: LimitReader asserts r to nothing; its Read calls r.Read.
    asserts:
      r: []
    vouches: [result]
    ensures:
      - "result != nil"

  io.TeeReader:
    reason: >-
      Documented: "TeeReader returns a Reader that writes to w what it reads
      from r. All reads from r performed through it are matched with
      corresponding writes to w. There is no internal buffering - the write
      must complete before the read completes." Its Read calls r.Read with
      p and then w.Write with what was read, so it meets the entry of
      (io.Reader).Read whenever r and w meet theirs.
    requires:
      - "r != nil"
      - "w != nil"
    keeps:
      r: [result]
      w: [result]
    modifies: []
    # Read from the source of Go 1.27: TeeReader asserts r and w to nothing; its Read calls r.Read and w.Write.
    asserts:
      r: []
      w: []
    vouches: [result]
    ensures:
      - "result != nil"

  io.MultiReader:
    reason: >-
      Documented: "MultiReader returns a Reader that's the logical
      concatenation of the provided input readers. They're read
      sequentially." It copies the slice, so a later change of an element
      changes nothing it reads. Its Read calls Read of one reader with p,
      so it meets the entry of (io.Reader).Read whenever they meet theirs;
      a nil reader would panic.
    requires:
      - "Forall i in [0, |readers|) : readers[i] != nil"
    keeps:
      readers: [result]
    modifies: []
    # Read from the source of Go 1.27: MultiReader asserts the readers only to its own *multiReader, and its Read calls their Read.
    asserts:
      readers: []
    vouches: [result]
    ensures:
      - "result != nil"

  io.MultiWriter:
    reason: >-
      Documented: "MultiWriter creates a writer that duplicates its writes
      to all the provided writers. Each write is written to each listed
      writer, one at a time. If a listed writer returns an error, that
      overall write operation stops and returns the error." It copies the
      slice. Its Write returns len(p) and nil only after every writer wrote
      all of p, and otherwise what the failing writer returned, or
      ErrShortWrite, so it meets the entry of (io.Writer).Write whenever
      they meet theirs; a nil writer would panic.
    requires:
      - "Forall i in [0, |writers|) : writers[i] != nil"
    keeps:
      writers: [result]
    modifies: []
    # Read from the source of Go 1.27: MultiWriter asserts the writers only to its own *multiWriter; its Write calls their Write. Its WriteString, which asserts StringWriter, runs only when code asserts the result.
    asserts:
      writers: []
    vouches: [result]
    ensures:
      - "result != nil"
