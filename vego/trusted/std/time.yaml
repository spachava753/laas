version: 1

# Functions and methods of package time that take and return values.

trusted:
  (time.Time).Date:
    reason: >-
      "Date returns the year, month, and day in which t occurs." A Month is
      January = 1 to December = 12, and a day of a month is 1 to 31. Not said:
      the year, and which day each month has. Read from the source of Go
      1.26.6 (time.go, zoneinfo.go): it reads t and the Location t points to,
      which writes nothing a caller can see but the lazy set-up of the Local
      location by a sync.Once in package time, memory that no formula can
      name.
    modifies: []
    ensures:
      - "1 <= month And month <= 12"
      - "1 <= day And day <= 31"

