version: 1

trusted:
  math/rand.Intn:
    reason: Documented to return a number in [0, n) and to panic if n <= 0.
    requires:
      - "n > 0"
    ensures:
      - "0 <= result And result < n"
    modifies: []

  math/rand.Int:
    reason: Documented to return a non-negative number.
    ensures:
      - "result >= 0"
    modifies: []
