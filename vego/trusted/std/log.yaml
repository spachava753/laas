version: 1

owns:
  log.Logger:
    fields: [out]
    reason: >-
      The methods of a Logger that print write the struct (its mutex and
      atomic fields) and, through Write of the writer its out field holds,
      what that writer owns. The buffers they format into come from a pool
      of package log, which verified code cannot reach. SetOutput, which
      sets out to what it is given, is not shipped.

state:
  log.Logger:
    ready:
      reason: >-
        True when the output of the logger is a writer that is not nil,
        whichever of New and SetOutput set it last, and its prefix is at most
        4096 bytes long, whichever of New and SetPrefix set it last. The zero
        value of a Logger has no output, and a method that prints to it
        panics on the nil writer; so does a Logger whose output was set to
        nil.

trusted:
  log.New:
    reason: >-
      Documented: "New creates a new Logger. The out variable sets the
      destination to which log data will be written." It returns a new
      Logger, which is ready since out is not nil and the prefix is short
      enough. It keeps out in that Logger and runs nothing: in the source of
      Go 1.27.3 New calls SetOutput, which stores out in the field out and
      compares it with io.Discard, and SetPrefix and SetFlags, which store
      numbers and a string. The field out is read only while a method of
      the Logger runs: in output, which every method that prints calls and
      which calls its Write and no other method, under a mutex, and in
      Writer and SetOutput. No goroutine, timer, finalizer, or package-level
      variable reaches it. The bound on the prefix is one that the formatting
      bound at the methods that print counts.
    requires:
      - "out != nil"
      - "|prefix| <= 4096"
    keeps:
      out: [result]
    modifies: []
    # Read from the source of Go 1.27: The Logger calls only Write of out.
    asserts:
      out: []
    vouches: [result]
    ensures:
      - "result != nil"
      - "fresh(result)"
      - "ready(result)"

  log.Printf:
    reason: >-
      Documented to call Output to print to the standard logger, with the
      arguments handled in the manner of fmt.Printf. The standard logger
      writes to the output that code that is not verified sets with
      log.SetOutput, or hands the message to the slog.Handler it sets with
      slog.SetDefault; the claim that the call returns and writes nothing a
      caller can see is a claim about that output.
    formats: [format, v]
    modifies: []

  log.Print:
    reason: >-
      Documented to call Output to print to the standard logger, with the
      arguments handled in the manner of fmt.Print. See log.Printf for what
      is claimed of the logger's output.
    formats: [v]
    modifies: []

  log.Println:
    reason: >-
      Documented to call Output to print to the standard logger, with the
      arguments handled in the manner of fmt.Println. See log.Printf for
      what is claimed of the logger's output.
    formats: [v]
    modifies: []

  (*log.Logger).Printf:
    reason: >-
      Documented to call l.Output to print to the logger, with the
      arguments handled in the manner of fmt.Printf. It writes to the writer l holds, which it runs, and calls only its
      Write method. A nil l panics, and so does a Logger whose output is
      nil, which ready rules out. The prefix it prints is at most 4096 bytes
      long while ready holds.
    requires:
      - "l != nil"
      - "ready(l)"
    runs: [l]
    formats: [format, v]
    modifies: []
    # Read from the source of Go 1.27: The Logger calls only Write of its output.
    asserts:
      l: []

  (*log.Logger).Print:
    reason: >-
      Documented to call l.Output to print to the logger, with the
      arguments handled in the manner of fmt.Print. It writes to the writer l holds, which it runs, and calls only its
      Write method. A nil l panics, and so does a Logger whose output is
      nil, which ready rules out. The prefix it prints is at most 4096 bytes
      long while ready holds.
    requires:
      - "l != nil"
      - "ready(l)"
    runs: [l]
    formats: [v]
    modifies: []
    # Read from the source of Go 1.27: The Logger calls only Write of its output.
    asserts:
      l: []

  (*log.Logger).Println:
    reason: >-
      Documented to call l.Output to print to the logger, with the
      arguments handled in the manner of fmt.Println. It writes to the writer l holds, which it runs, and calls only its
      Write method. A nil l panics, and so does a Logger whose output is
      nil, which ready rules out. The prefix it prints is at most 4096 bytes
      long while ready holds.
    requires:
      - "l != nil"
      - "ready(l)"
    runs: [l]
    formats: [v]
    modifies: []
    # Read from the source of Go 1.27: The Logger calls only Write of its output.
    asserts:
      l: []
