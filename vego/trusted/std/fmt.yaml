version: 1

# Every entry of this file is isolated: read from the source of Go 1.26.6 and
# 1.27.3, package fmt keeps no hook that another call can set. Its only
# package-level state is the pool of printers it fills itself; Print, Printf,
# and Println write os.Stdout, an *os.File, which holds no code. What fmt runs
# is the Format, GoString, Error, and String methods of the values it is
# handed, and Write of the writer it is handed.
isolated: true

trusted:
  fmt.Sprintf:
    reason: >-
      Documented to format according to a format specifier and return the
      resulting string. It formats its operands in the manner the
      documentation of fmt describes, which calls their Format, GoString,
      Error, and String methods; vego checks the operands at each call.
      Nothing is known of the string.
    formats: [format, a]
    modifies: []

  fmt.Sprint:
    reason: >-
      Documented to format using the default formats for its operands and
      return the resulting string. Nothing is known of the string.
    formats: [a]
    modifies: []

  fmt.Sprintln:
    reason: >-
      Documented to format using the default formats for its operands and
      return the resulting string, with spaces between operands and a
      newline. Nothing is known of the string.
    formats: [a]
    modifies: []

  fmt.Printf:
    reason: >-
      Documented to format according to a format specifier and write to
      standard output, returning the number of bytes written and any write
      error. Standard output is os.Stdout, which code that is not verified
      may set to any *os.File; the claim that the call returns is a claim
      that a write to it returns. Nothing is known of n or err.
    formats: [format, a]
    modifies: []

  fmt.Print:
    reason: >-
      Documented to format using the default formats for its operands and
      write to standard output, returning the number of bytes written and
      any write error. Nothing is known of n or err.
    formats: [a]
    modifies: []

  fmt.Println:
    reason: >-
      Documented to format using the default formats for its operands and
      write to standard output, with spaces between operands and a newline,
      returning the number of bytes written and any write error. Nothing is
      known of n or err.
    formats: [a]
    modifies: []

  fmt.Fprintf:
    reason: >-
      Documented to format according to a format specifier and write to w,
      returning the number of bytes written and any write error. It calls
      w.Write, and panics on a nil w. Nothing is known of n or err.
    requires:
      - "w != nil"
    runs: [w]
    formats: [format, a]
    modifies: [w]
    vouches: [w]
    # Read from the source of Go 1.27: Fprintf calls only w.Write.
    # Read from the source of Go 1.26.6 and 1.27.3: Fprintf formats into a
    # buffer as Sprintf does and then calls w.Write once with it,
    # returning what Write returned; TestPrintsClaims checks it.
    prints: {w: fmt.Sprintf}
    asserts:
      w: []

  fmt.Fprint:
    reason: >-
      Documented to format using the default formats for its operands and
      write to w, returning the number of bytes written and any write
      error. It calls w.Write, and panics on a nil w. Nothing is known of n
      or err.
    requires:
      - "w != nil"
    runs: [w]
    formats: [a]
    modifies: [w]
    vouches: [w]
    # Read from the source of Go 1.27: Fprint calls only w.Write.
    # Read from the source of Go 1.26.6 and 1.27.3: Fprint formats into a
    # buffer as Sprint does and then calls w.Write once with it,
    # returning what Write returned; TestPrintsClaims checks it.
    prints: {w: fmt.Sprint}
    asserts:
      w: []

  fmt.Fprintln:
    reason: >-
      Documented to format using the default formats for its operands and
      write to w, with spaces between operands and a newline, returning the
      number of bytes written and any write error. It calls w.Write, and
      panics on a nil w. Nothing is known of n or err.
    requires:
      - "w != nil"
    runs: [w]
    formats: [a]
    modifies: [w]
    vouches: [w]
    # Read from the source of Go 1.27: Fprintln calls only w.Write.
    # Read from the source of Go 1.26.6 and 1.27.3: Fprintln formats into a
    # buffer as Sprintln does and then calls w.Write once with it,
    # returning what Write returned; TestPrintsClaims checks it.
    prints: {w: fmt.Sprintln}
    asserts:
      w: []
