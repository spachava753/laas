version: 1

state:
  bufio.Scanner:
    ready:
      reason: >-
        True when the Scanner was made by NewScanner with a reader that is
        not nil, and neither Split nor Buffer has been called on it since. It
        then splits lines with ScanLines and buffers at most
        MaxScanTokenSize bytes. The zero value has no reader and no split
        function.
  bufio.Reader:
    ready:
      reason: >-
        True when the Reader reads from a reader that is not nil: the last
        of NewReader, NewReaderSize, and Reset that set its reader set one
        that is not nil. Reset to the Reader itself sets nothing. The zero
        value reads from nil, and its methods that read never return or
        panic; so do those of a Reader reset to nil.
  bufio.Writer:
    ready:
      reason: >-
        True when the Writer writes to a writer that is not nil: the last of
        NewWriter, NewWriterSize, and Reset that set its writer set one that
        is not nil. Reset to the Writer itself sets nothing. The zero value
        writes to nil, and its methods that write never return or panic; so
        do those of a Writer reset to nil.

# What the source was read for, in Go 1.27.3 (bufio.go and scan.go): every
# place that stores the reader or writer a constructor is given (the fields
# rd, wr, and r, set only by the constructors and by Reset), every read of
# those fields, and whether any of them is in a goroutine, a timer, a
# finalizer or cleanup, a callback given to another package, or reached
# from a package-level variable. None is. The methods shipped here call
# Read or Write of the kept value and nothing else of it: the type
# assertions to io.WriterTo, io.ReaderFrom, and io.StringWriter of the kept
# value are on WriteTo, ReadFrom, and WriteString, which have no entry, and
# the assertions to *Reader and *Writer in the constructors call nothing.
trusted:
  bufio.NewScanner:
    reason: >-
      Documented: "NewScanner returns a new Scanner to read from r. The
      split function defaults to ScanLines." The Scanner is new and ready.
      It keeps r in the field r of the Scanner and calls nothing; only Scan
      reads that field, to call r.Read.
    requires:
      - "r != nil"
    keeps:
      r: [result]
    modifies: []
    # Read from the source of Go 1.27: NewScanner and the methods of Scanner assert r to nothing; Scan calls r.Read.
    asserts:
      r: []
    vouches: [result]
    ensures:
      - "result != nil"
      - "fresh(result)"
      - "ready(result)"

  (*bufio.Scanner).Scan:
    reason: >-
      Documented to advance the Scanner to the next token, and to return
      false when the scan stops, by reaching the end of the input or an
      error. While it runs it calls Read of the reader the Scanner keeps,
      with a slice that is not empty, and the split function, which ready
      says is ScanLines. Scan panics only when a split function returns too
      many empty tokens without advancing the input, which ScanLines does
      not do. A Read that returns
      no bytes and no error is retried at most 100 times before Scan stops
      with io.ErrNoProgress, and a token longer than the buffer, which is
      at most MaxScanTokenSize bytes, stops it with ErrTooLong, so Scan
      returns when Read does.
    requires:
      - "s != nil"
      - "ready(s)"
    runs: [s]
    modifies: [s]
    # Read from the source of Go 1.27: Scan calls only Read of the reader it keeps, and the split function.
    asserts:
      s: []
    vouches: [s]
    ensures:
      - "ready(s')"

  (*bufio.Scanner).Text:
    reason: >-
      Documented: "Text returns the most recent token generated by a call
      to Scan as a newly allocated string holding its bytes." A token is
      part of the buffer, which a ready Scanner keeps at most
      MaxScanTokenSize bytes long, as documented. It runs nothing.
    requires:
      - "s != nil"
      - "ready(s)"
    runs: [s]
    modifies: []
    # Read from the source of Go 1.27: Text calls nothing the Scanner keeps.
    asserts:
      s: []
    ensures:
      - "|result| <= 65536"

  (*bufio.Scanner).Err:
    reason: >-
      Documented: "Err returns the first non-EOF error that was encountered
      by the Scanner." It runs nothing. The error may be one the reader
      returned, of which nothing is claimed.
    requires:
      - "s != nil"
    runs: [s]
    modifies: []
    # Read from the source of Go 1.27: Err calls nothing the Scanner keeps.
    asserts:
      s: []

  bufio.NewReader:
    reason: >-
      Documented: "NewReader returns a new Reader whose buffer has the
      default size", and NewReaderSize, which it calls, "If the argument
      io.Reader is already a Reader with large enough size, it returns the
      underlying Reader." So the result is not always new. It is ready:
      a new one reads from rd, and a Reader that rd holds, and every reader
      that one reads from, meets the entry of (io.Reader).Read, as every
      reader in memory that an argument reaches does, which a Reader that
      reads from nil does not, since its Read panics once its buffer is
      empty. It keeps rd in the field rd of the new Reader and calls
      nothing.
    requires:
      - "rd != nil"
    keeps:
      rd: [result]
    modifies: []
    # Read from the source of Go 1.27: NewReaderSize asserts rd to *Reader, whose reader it then uses, and calls nothing.
    asserts:
      rd: []
    vouches: [result]
    ensures:
      - "result != nil"
      - "ready(result)"

  (*bufio.Reader).ReadByte:
    reason: >-
      Documented: "ReadByte reads and returns a single byte. If no byte is
      available, returns an error." It calls Read of the reader b reads
      from, with the free part of its buffer, which is not empty since
      ReadByte reads only when the buffer is empty; a Read that returns no
      bytes and no error is retried at most 100 times before the Reader
      fails with io.ErrNoProgress, so ReadByte returns when Read does. The
      error may be one the reader returned.
    requires:
      - "b != nil"
      - "ready(b)"
    runs: [b]
    modifies: [b]
    # Read from the source of Go 1.27: ReadByte calls only Read of the reader it keeps.
    asserts:
      b: []
    vouches: [b]
    ensures:
      - "ready(b')"

  bufio.NewWriter:
    reason: >-
      Documented: "NewWriter returns a new Writer whose buffer has the
      default size. If the argument io.Writer is already a Writer with
      large enough buffer size, it returns the underlying Writer." So the
      result is not always new. It is ready: a new one writes to w, and a
      Writer that w holds, and every writer that one writes to, meets the
      entry of (io.Writer).Write, as every writer in memory that an
      argument reaches does, which a Writer that writes to nil does not,
      since its Write panics once its buffer is full. It keeps w in the
      field wr of the new Writer and calls nothing.
    requires:
      - "w != nil"
    keeps:
      w: [result]
    modifies: []
    # Read from the source of Go 1.27: NewWriterSize asserts w to *Writer, whose writer it then uses, and calls nothing.
    asserts:
      w: []
    vouches: [result]
    ensures:
      - "result != nil"
      - "ready(result)"

  (*bufio.Writer).Write:
    reason: >-
      Documented: "Write writes the contents of p into the buffer. It
      returns the number of bytes written. If nn < len(p), it also returns
      an error explaining why the write is short." It calls Write of the
      writer b writes to, with p or with its buffer, and nothing else of
      it; that Write returns an error when it writes less than it is
      given, so the loop of Write ends. It does not write p.
    requires:
      - "b != nil"
      - "ready(b)"
    runs: [b]
    modifies: [b]
    # Read from the source of Go 1.27: Write calls only Write of the writer it keeps; WriteString and ReadFrom, which assert, are not shipped.
    asserts:
      b: []
    vouches: [b]
    ensures:
      - "ready(b')"
      - "0 <= nn And nn <= |p|"
      - "nn < |p| -> err != nil"

  (*bufio.Writer).WriteByte:
    reason: >-
      Documented: "WriteByte writes a single byte." It calls Write of the
      writer b writes to when its buffer is full, through Flush.
    requires:
      - "b != nil"
      - "ready(b)"
    runs: [b]
    modifies: [b]
    # Read from the source of Go 1.27: WriteByte calls only Write of the writer it keeps, through Flush.
    asserts:
      b: []
    vouches: [b]
    ensures:
      - "ready(b')"

  (*bufio.Writer).Flush:
    reason: >-
      Documented: "Flush writes any buffered data to the underlying
      io.Writer." It calls Write of that writer once, with the buffered
      data, and returns its error or io.ErrShortWrite.
    requires:
      - "b != nil"
      - "ready(b)"
    runs: [b]
    modifies: [b]
    # Read from the source of Go 1.27: Flush calls only Write of the writer it keeps.
    asserts:
      b: []
    vouches: [b]
    ensures:
      - "ready(b')"
