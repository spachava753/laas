version: 1

owns:
  bufio.Writer:
    fields: [buf, wr]
    reason: >-
      The methods of a Writer write the struct, the array its buf field
      holds, and through Write of the writer its wr field holds what that
      writer owns; NewWriter and NewWriterSize make the array new. Reset,
      which sets wr to what it is given, is not shipped.
  bufio.Reader:
    fields: [buf, rd]
    reason: >-
      The methods of a Reader write the struct, the array its buf field
      holds, and through Read of the reader its rd field holds what that
      reader owns; NewReader and NewReaderSize make the array new. Reset is
      not shipped.
  bufio.Scanner:
    fields: [r, buf]
    reason: >-
      The methods of a Scanner write the struct, the array its buf field
      holds, which Scan grows only into new memory, and through Read of the
      reader its r field holds what that reader owns. Buffer, which hands
      it an array of the caller's, is not shipped.

state:
  bufio.Scanner:
    ready:
      reason: >-
        True when the Scanner was made by NewScanner with a reader that is
        not nil, and neither Split nor Buffer has been called on it since. It
        then splits lines with ScanLines and buffers at most
        MaxScanTokenSize bytes. The zero value has no reader and no split
        function.
  bufio.Reader:
    ready:
      reason: >-
        True when the Reader reads from a reader that is not nil: the last
        of NewReader, NewReaderSize, and Reset that set its reader set one
        that is not nil. Reset to the Reader itself sets nothing. The zero
        value reads from nil, and its methods that read never return or
        panic; so do those of a Reader reset to nil.
  bufio.Writer:
    ready:
      reason: >-
        True when the Writer writes to a writer that is not nil: the last of
        NewWriter, NewWriterSize, and Reset that set its writer set one that
        is not nil. Reset to the Writer itself sets nothing. The zero value
        writes to nil, and its methods that write never return or panic; so
        do those of a Writer reset to nil.

# What the source was read for, in Go 1.27.3 (bufio.go and scan.go): every
# place that stores the reader or writer a constructor is given (the fields
# rd, wr, and r, set only by the constructors and by Reset), every read of
# those fields, and whether any of them is in a goroutine, a timer, a
# finalizer or cleanup, a callback given to another package, or reached
# from a package-level variable. None is. The methods shipped here call
# Read or Write of the kept value and nothing else of it: the type
# assertions to io.WriterTo, io.ReaderFrom, and io.StringWriter of the kept
# value are on WriteTo and ReadFrom, which have no entry, and on WriteString,
# whose entry lists it under asserts, and
# the assertions to *Reader and *Writer in the constructors call nothing.
trusted:
  bufio.NewScanner:
    reason: >-
      Documented: "NewScanner returns a new Scanner to read from r. The
      split function defaults to ScanLines." The Scanner is new and ready.
      It keeps r in the field r of the Scanner and calls nothing; only Scan
      reads that field, to call r.Read. What the Scanner owns is new but for
      what r writes, which its footprint holds.
    requires:
      - "r != nil"
    keeps:
      r: [result]
    modifies: []
    # Read from the source of Go 1.27: NewScanner and the methods of Scanner assert r to nothing; Scan calls r.Read.
    asserts:
      r: []
    vouches: [result]
    ensures:
      - "result != nil"
      - "fresh(result, r)"
      - "ready(result)"
    # Under the declaration that inputs end: a Scanner over a reader the
    # declaration covers is covered, and reads only through it.
    inputs:
      - "ends(r) -> ends(result)"

  (*bufio.Scanner).Scan:
    reason: >-
      Documented to advance the Scanner to the next token, and to return
      false when the scan stops, by reaching the end of the input or an
      error. While it runs it calls Read of the reader the Scanner keeps,
      with a slice that is not empty, and the split function, which ready
      says is ScanLines. Scan panics only when a split function returns too
      many empty tokens without advancing the input, which ScanLines does
      not do. A Read that returns
      no bytes and no error is retried at most 100 times before Scan stops
      with io.ErrNoProgress, and a token longer than the buffer, which is
      at most MaxScanTokenSize bytes, stops it with ErrTooLong, so Scan
      returns when Read does.
    requires:
      - "s != nil"
      - "ready(s)"
    runs: [s]
    modifies: [s]
    # Read from the source of Go 1.27: Scan calls only Read of the reader it keeps, and the split function.
    asserts:
      s: []
    vouches: [s]
    ensures:
      - "ready(s')"
    # Under the declaration that inputs end, read from scan.go of Go
    # 1.26.6 and 1.27.3: Scan returns true only for a token the split
    # function advanced over, and ScanLines, which ready says is the split
    # function, advances at least one byte for every token (to the newline,
    # or to the end of the data at the end of the input); so a true Scan
    # consumes a byte of what the Scanner reads, at most the declared
    # amount for a reader that ends, and a false Scan consumes none that
    # unread would count again.
    inputs:
      - "ends(s') = ends(s)"
      - "ends(s) And result -> unread(s') < unread(s)"
      - "ends(s) -> unread(s') <= unread(s)"

  (*bufio.Scanner).Text:
    reason: >-
      Documented: "Text returns the most recent token generated by a call
      to Scan as a newly allocated string holding its bytes." A token is
      part of the buffer, which a ready Scanner keeps at most
      MaxScanTokenSize bytes long, as documented. It runs nothing.
    requires:
      - "s != nil"
      - "ready(s)"
    runs: [s]
    modifies: []
    # Read from the source of Go 1.27: Text calls nothing the Scanner keeps.
    asserts:
      s: []
    ensures:
      - "|result| <= 65536"

  (*bufio.Scanner).Err:
    reason: >-
      Documented: "Err returns the first non-EOF error that was encountered
      by the Scanner." It runs nothing. The error may be one the reader
      returned, of which nothing is claimed.
    requires:
      - "s != nil"
    runs: [s]
    modifies: []
    # Read from the source of Go 1.27: Err calls nothing the Scanner keeps.
    asserts:
      s: []

  bufio.NewReader:
    reason: >-
      Documented: "NewReader returns a new Reader whose buffer has the
      default size", and NewReaderSize, which it calls, "If the argument
      io.Reader is already a Reader with large enough size, it returns the
      underlying Reader." So the result is not always new. It is ready:
      a new one reads from rd, and a Reader that rd holds, and every reader
      that one reads from, meets the entry of (io.Reader).Read, as every
      reader in memory that an argument reaches does, which a Reader that
      reads from nil does not, since its Read panics once its buffer is
      empty. It keeps rd in the field rd of the new Reader and calls
      nothing. What the result owns is new but for what rd writes: a new
      Reader owns a new buffer and rd, and the Reader that rd holds is what
      rd writes.
    requires:
      - "rd != nil"
    keeps:
      rd: [result]
    modifies: []
    # Read from the source of Go 1.27: NewReaderSize asserts rd to *Reader, whose reader it then uses, and calls nothing.
    asserts:
      rd: []
    vouches: [result]
    ensures:
      - "result != nil"
      - "fresh(result, rd)"
      - "ready(result)"
    # Under the declaration that inputs end: a Reader over a reader the
    # declaration covers, or the Reader that rd holds when NewReader
    # returns it, reads only from what rd reads.
    inputs:
      - "ends(rd) -> ends(result)"

  (*bufio.Reader).ReadByte:
    reason: >-
      Documented: "ReadByte reads and returns a single byte. If no byte is
      available, returns an error." It calls Read of the reader b reads
      from, with the free part of its buffer, which is not empty since
      ReadByte reads only when the buffer is empty; a Read that returns no
      bytes and no error is retried at most 100 times before the Reader
      fails with io.ErrNoProgress, so ReadByte returns when Read does. The
      error may be one the reader returned.
    requires:
      - "b != nil"
      - "ready(b)"
    runs: [b]
    modifies: [b]
    # Read from the source of Go 1.27: ReadByte calls only Read of the reader it keeps.
    asserts:
      b: []
    vouches: [b]
    ensures:
      - "ready(b')"
    # Under the declaration that inputs end: a nil error is a byte read.
    inputs:
      - "ends(b') = ends(b)"
      - "ends(b) And result2 = nil -> unread(b') < unread(b)"
      - "ends(b) -> unread(b') <= unread(b)"

  (*bufio.Reader).ReadString:
    reason: >-
      "ReadString reads until the first occurrence of delim in the input,
      returning a string containing the data up to and including the
      delimiter. If ReadString encounters an error before finding a
      delimiter, it returns the data read before the error and the error
      itself (often io.EOF). ReadString returns err != nil if and only if
      the returned data does not end in delim." Usable only under the
      declaration that inputs end, for a Reader it covers, from which it
      returns. Read from the source of Go 1.26.6 and 1.27.3, which is the
      same (bufio.go): collectFragments calls ReadSlice until it finds
      delim or meets an error, copying each full buffer and appending it
      to a slice of slices, 24 bytes for each buffer of at least 16 bytes,
      which grows to at most three times the bytes read and a page; then a
      Builder grown to the total. So what it returns is what it consumed,
      at least the delimiter when the error is nil. It calls only Read of
      the reader b keeps.
    requires:
      - "b != nil"
      - "ready(b)"
      - "ends(b)"
      - "Inputs < MaxInt"
      - "3 * Inputs + 65536 <= MaxAlloc"
    runs: [b]
    modifies: [b]
    asserts:
      b: []
    vouches: [b]
    ensures:
      - "ready(b')"
      - "ends(b')"
      - "result2 = nil -> 1 <= |result1| And result1[|result1| - 1] = delim"
      - "|result1| <= unread(b) - unread(b')"
      - "result2 = nil -> unread(b') < unread(b)"

  (*bufio.Reader).ReadBytes:
    reason: >-
      "ReadBytes reads until the first occurrence of delim in the input,
      returning a slice containing the data up to and including the
      delimiter. If ReadBytes encounters an error before finding a
      delimiter, it returns the data read before the error and the error
      itself (often io.EOF). ReadBytes returns err != nil if and only if the
      returned data does not end in delim." As ReadString, with a new slice
      of the total in place of the Builder.
    requires:
      - "b != nil"
      - "ready(b)"
      - "ends(b)"
      - "Inputs < MaxInt"
      - "3 * Inputs + 65536 <= MaxAlloc"
    runs: [b]
    modifies: [b]
    asserts:
      b: []
    vouches: [b]
    ensures:
      - "ready(b')"
      - "ends(b')"
      - "fresh(result1)"
      - "result2 = nil -> 1 <= |result1| And result1[|result1| - 1] = delim"
      - "|result1| <= unread(b) - unread(b')"
      - "result2 = nil -> unread(b') < unread(b)"

  bufio.NewWriter:
    reason: >-
      Documented: "NewWriter returns a new Writer whose buffer has the
      default size. If the argument io.Writer is already a Writer with
      large enough buffer size, it returns the underlying Writer." So the
      result is not always new. It is ready: a new one writes to w, and a
      Writer that w holds, and every writer that one writes to, meets the
      entry of (io.Writer).Write, as every writer in memory that an
      argument reaches does, which a Writer that writes to nil does not,
      since its Write panics once its buffer is full. It keeps w in the
      field wr of the new Writer and calls nothing. What the result owns is
      new but for what w writes: a new Writer owns a new buffer and w, and
      the Writer that w holds is what w writes.
    requires:
      - "w != nil"
    keeps:
      w: [result]
    modifies: []
    # Read from the source of Go 1.27: NewWriterSize asserts w to *Writer,
    # whose writer it then uses, and calls nothing. The WriteString of the
    # Writer it returns asserts w to io.StringWriter (see below), which this
    # claim covers since that method has an entry.
    asserts:
      w: [io.StringWriter]
    vouches: [result]
    ensures:
      - "result != nil"
      - "fresh(result, w)"
      - "ready(result)"

  (*bufio.Writer).Write:
    reason: >-
      Documented: "Write writes the contents of p into the buffer. It
      returns the number of bytes written. If nn < len(p), it also returns
      an error explaining why the write is short." It calls Write of the
      writer b writes to, with p or with its buffer, and nothing else of
      it; that Write returns an error when it writes less than it is
      given, so the loop of Write ends. It does not write p.
    requires:
      - "b != nil"
      - "ready(b)"
    runs: [b]
    modifies: [b]
    # Read from the source of Go 1.27: Write calls only Write of the writer it keeps; ReadFrom, which asserts, is not shipped.
    asserts:
      b: []
    vouches: [b]
    ensures:
      - "ready(b')"
      - "0 <= nn And nn <= |p|"
      - "nn < |p| -> err != nil"

  (*bufio.Writer).WriteString:
    reason: >-
      Documented: "WriteString writes a string. It returns the number of
      bytes written. If the count is less than len(s), it also returns an
      error explaining why the write is short." Read from the source of Go
      1.26.6 and 1.27.3: while s does not fit in what is free of the
      buffer and no error was met, it hands s to the WriteString of the
      writer b writes to when the buffer is empty and that writer has one,
      and otherwise fills the buffer and flushes it through that writer's
      Write; then it copies the rest into the buffer. The loop ends, and s
      is sliced within its bounds, because WriteString meets the entry of
      (io.StringWriter).WriteString and Write that of (io.Writer).Write.
    requires:
      - "b != nil"
      - "ready(b)"
    runs: [b]
    modifies: [b]
    # Read from the source of Go 1.26.6 and 1.27.3: WriteString asserts the
    # writer it keeps to io.StringWriter, once, when its buffer is empty and
    # s does not fit, and calls that WriteString or the writer's Write,
    # through Flush, and nothing else of it.
    asserts:
      b: [io.StringWriter]
    vouches: [b]
    ensures:
      - "ready(b')"
      - "0 <= result1 And result1 <= |s|"
      - "result1 < |s| -> result2 != nil"

  (*bufio.Writer).WriteByte:
    reason: >-
      Documented: "WriteByte writes a single byte." It calls Write of the
      writer b writes to when its buffer is full, through Flush.
    requires:
      - "b != nil"
      - "ready(b)"
    runs: [b]
    modifies: [b]
    # Read from the source of Go 1.27: WriteByte calls only Write of the writer it keeps, through Flush.
    asserts:
      b: []
    vouches: [b]
    ensures:
      - "ready(b')"

  (*bufio.Writer).Flush:
    reason: >-
      Documented: "Flush writes any buffered data to the underlying
      io.Writer." It calls Write of that writer once, with the buffered
      data, and returns its error or io.ErrShortWrite.
    requires:
      - "b != nil"
      - "ready(b)"
    runs: [b]
    modifies: [b]
    # Read from the source of Go 1.27: Flush calls only Write of the writer it keeps.
    asserts:
      b: []
    vouches: [b]
    ensures:
      - "ready(b')"
