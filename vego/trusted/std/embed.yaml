version: 1

# The methods of embed.FS that read what the binary holds (F39, part B),
# read from embed.go of Go 1.26.6 and 1.27.3, which is the same. They need
# no declaration that inputs end: what they read is in the binary.
trusted:
  (embed.FS).ReadFile:
    reason: >-
      Documented: "ReadFile reads and returns the content of the named
      file." It looks the name up in the sorted list of the files the
      compiler embedded, by binary search, with fs.ValidPath first, and
      returns []byte of the file's data, a new copy; for a name it does not
      find it returns a *fs.PathError holding fs.ErrNotExist, and for a
      directory one holding an error made by errors.New, so vouches holds.
      The copy goes through rawbyteslice (runtime/string.go:331), which
      rounds the size up to what the allocator gives and sets the capacity
      with int(cap), negative for a string longer than MaxInt less a page on
      a 32-bit target, with no panic. An embedded file is below that: the
      linker refuses a data section of more than cutoff = 2e9 bytes
      (cmd/link/internal/ld/data.go:1452, checkdatsize and checkSectSize,
      the same in Go 1.26.6 and 1.27.3), so a copy rounded to a page stays
      below MaxInt on every target, and below MaxAlloc (F16 of the review of
      step 4 of F39).
    vouches: [result2]
    modifies: []
    ensures:
      - "result2 = nil -> fresh(result1)"

  (embed.FS).ReadDir:
    reason: >-
      Documented: "ReadDir reads and returns the entire named directory."
      It opens the directory as ReadFile looks a name up, and makes a slice
      of an fs.DirEntry for each of its files, which is shorter than the
      list of files the binary holds, each of which is larger than an
      interface value, and fills it with pointers to them, whose Name,
      IsDir, and Type return what split finds in the name and write
      nothing, as the entries of fs.DirEntry claim; its errors are those
      of ReadFile's lookup, or a *fs.PathError holding an error made by
      errors.New for a file that is not a directory.
    vouches: [result1, result2]
    modifies: []
    ensures:
      - "fresh(result1)"
      - "Forall i in [0, |result1|) : result1[i] != nil"
