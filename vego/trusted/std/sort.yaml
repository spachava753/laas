version: 1

trusted:
  sort.Ints:
    reason: Documented to sort a slice of ints in increasing order.
    modifies: [x]
    ensures:
      - "Forall i in [0, |x|) : Forall j in [i, |x|) : x'[i] <= x'[j]"

  sort.IntsAreSorted:
    reason: Documented to report whether the slice is sorted in increasing order.
    ensures:
      - "result <-> Forall i in [0, |x|) : Forall j in [i, |x|) : x[i] <= x[j]"
    modifies: []

  sort.SearchInts:
    reason: >-
      Documented to return the smallest index at which x could be inserted
      into a sorted slice so that it stays sorted.
    requires:
      - "Forall i in [0, |a|) : Forall j in [i, |a|) : a[i] <= a[j]"
    ensures:
      - "0 <= result And result <= |a|"
      - "a[0:result) < x"
      - "x <= a[result:|a|)"
    modifies: []

  sort.Search:
    reason: >-
      Documented to call f(i) only for i in the range [0, n), and, for an f
      that is false and then true over [0, n), to return the first i at which
      f(i) is true, or n if there is none. For any other f the documentation
      says nothing of the result, and neither does this entry. For a negative
      n the documentation says that it returns n, and it returns 0, so n must
      not be negative.
    requires:
      - "n >= 0"
    runs: [f]
    calls:
      f(i):
        requires: ["0 <= i < n"]
    modifies: []
    ensures:
      - "(Forall i in [0, n) : Forall j in [i, n) : f(i) -> f(j)) -> (0 <= result And result <= n And (Forall i in [0, result) : ~f(i)) And (result < n -> f(result)))"

  sort.Find:
    reason: >-
      Documented to call cmp(i) only for i in the range [0, n), and, for a cmp
      that is positive, then zero, then negative over [0, n), to return the
      first i at which cmp(i) <= 0, or n if there is none, with found true when
      i < n and cmp(i) is 0. For any other cmp the documentation says nothing
      of the result, and neither does this entry. For a negative n the
      documentation says that it returns n, and it returns 0, so n must not be
      negative.
    requires:
      - "n >= 0"
    runs: [cmp]
    calls:
      cmp(k):
        requires: ["0 <= k < n"]
    modifies: []
    ensures:
      - "(Forall a in [0, n) : Forall b in [a, n) : (cmp(a) <= 0 -> cmp(b) <= 0) And (cmp(a) < 0 -> cmp(b) < 0)) -> (0 <= i And i <= n And (Forall a in [0, i) : cmp(a) > 0) And (i < n -> cmp(i) <= 0) And (found <-> (i < n And cmp(i) = 0)))"

  sort.Strings:
    reason: >-
      "Strings sorts a slice of strings in increasing order." Sorting
      permutes the elements of x, so every element after the call is one of
      those before it, and every element before it is still there. Not said:
      the order, since the logic has no order of strings, and that each
      element is there as many times as before, which needs a count the
      logic has no term for.
    modifies: [x]
    ensures:
      - "Forall i in [0, |x|) : Exists j in [0, |x|) : x'[i] = x[j]"
      - "Forall j in [0, |x|) : Exists i in [0, |x|) : x'[i] = x[j]"

  sort.Slice:
    reason: >-
      "Slice sorts the slice x given the provided less function. It panics if
      x is not a slice. The sort is not guaranteed to be stable: equal
      elements may be reversed from their original order." Read through the
      typed view [S ~[]E, E any](x S, less func(i, j int) bool), at the
      static type of the argument, which is a slice, since x is that
      argument as an any. Read from the source of Go 1.26.6 and 1.27.3,
      which is the same (slice.go, zsortfunc.go, internal/reflectlite's
      swapper.go): it swaps elements of x with reflectlite.Swapper, which
      reserves the scratch space of one element, and calls less(i, j) with
      indices of x only, on the calling goroutine, while the call lasts,
      keeping it nowhere; pdqsort_func only swaps, in loops bounded by the
      indices whatever less answers, and its recursion is bounded by its
      limit. So it returns for any less, and x holds afterwards the
      elements it held, as many times. Not said: the order, which a formula
      cannot state of every element type nor of a less that is no ordering;
      and at a type argument whose values a formula cannot compare, a
      struct, anything of the elements.
    asserts: {S: [], E: []}
    runs: [less]
    calls:
      less(i, j):
        requires: ["0 <= i < |x|", "0 <= j < |x|"]
    modifies: [x]
    compares:
      - "Forall i in [0, |x'|) : Exists j in [0, |x|) : x'[i] = x[j]"
      - "Forall j in [0, |x|) : Exists i in [0, |x'|) : x'[i] = x[j]"

  sort.SliceStable:
    reason: >-
      "SliceStable sorts the slice x using the provided less function,
      keeping equal elements in their original order. It panics if x is not
      a slice." Read through the typed view of sort.Slice. Read from the
      source of Go 1.26.6 and 1.27.3, which is the same: stable_func sorts
      blocks by insertion and merges them with symMerge_func and
      rotate_func, which only swap elements of x through Swapper, in loops
      bounded by indices of x whatever less answers and a recursion that
      halves the stretch it merges; it calls less(i, j) with indices of x
      only, on the calling goroutine, while the call lasts, and keeps it
      nowhere. So it returns for any less, and x holds afterwards the
      elements it held, as many times. Not said: the order, as for Slice.
    asserts: {S: [], E: []}
    runs: [less]
    calls:
      less(i, j):
        requires: ["0 <= i < |x|", "0 <= j < |x|"]
    modifies: [x]
    compares:
      - "Forall i in [0, |x'|) : Exists j in [0, |x|) : x'[i] = x[j]"
      - "Forall j in [0, |x|) : Exists i in [0, |x'|) : x'[i] = x[j]"
