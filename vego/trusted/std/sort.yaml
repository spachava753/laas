version: 1

trusted:
  sort.Ints:
    reason: Documented to sort a slice of ints in increasing order.
    modifies: [x]
    ensures:
      - "Forall i in [0, |x|) : Forall j in [i, |x|) : x'[i] <= x'[j]"

  sort.IntsAreSorted:
    reason: Documented to report whether the slice is sorted in increasing order.
    ensures:
      - "result <-> Forall i in [0, |x|) : Forall j in [i, |x|) : x[i] <= x[j]"
    modifies: []

  sort.SearchInts:
    reason: >-
      Documented to return the smallest index at which x could be inserted
      into a sorted slice so that it stays sorted.
    requires:
      - "Forall i in [0, |a|) : Forall j in [i, |a|) : a[i] <= a[j]"
    ensures:
      - "0 <= result And result <= |a|"
      - "a[0:result) < x"
      - "x <= a[result:|a|)"
    modifies: []

  sort.Search:
    reason: >-
      Documented to call f(i) only for i in the range [0, n). Its result is
      documented only for an f that is false and then true over [0, n), which
      this entry cannot state, so it says nothing of it. For a negative n the
      documentation says that it returns n, and it returns 0, so n must not be
      negative.
    requires:
      - "n >= 0"
    runs: [f]
    calls:
      f(i):
        requires: ["0 <= i < n"]
    modifies: []

  sort.Find:
    reason: >-
      Documented to call cmp(i) only for i in the range [0, n). Its result is
      documented only for a cmp that is positive, then zero, then negative over
      [0, n), which this entry cannot state, so it says nothing of it. For a
      negative n the documentation says that it returns n, and it returns 0, so
      n must not be negative.
    requires:
      - "n >= 0"
    runs: [cmp]
    calls:
      cmp(k):
        requires: ["0 <= k < n"]
    modifies: []
