version: 1

owns:
  bytes.Buffer:
    fields: [buf]
    length: "|buf| - off"
    holds:
      - "0 <= off"
      - "off <= |buf|"
    reason: >-
      The methods of a Buffer write the struct and the array its buf field holds, and grow that array only into new memory, by append. Bytes and the methods that return a slice hand out part of that array; nothing else of it is let out. Its length, |b| in a formula, is what Len returns: "Len returns the number of bytes of the unread portion of the buffer; b.Len() == len(b.Bytes())." The unread portion is buf[off:], so 0 <= off <= len(buf) holds of every Buffer: the zero value has off 0, every method keeps it (read from the source of Go 1.26.6 and 1.27.3), and no other code can write the unexported fields.

trusted:
  (*bytes.Buffer).Write:
    reason: >-
      Documented: "Write appends the contents of p to the buffer, growing the buffer as needed. The return value n is the length of p; err is always nil. If the buffer becomes too large, Write will panic with [ErrTooLarge]." The requires is read from the source of Go
      1.26.6 and 1.27.3 (buffer.go, tryGrowByReslice, grow, and growSlice;
      runtime/slice.go): the buffer moves only when what is written fits
      neither the free capacity after the write end (so cap - off < Len +
      n) nor half the capacity once the unread bytes are slid to the front
      (so cap < 2 * (Len + n)). Then grow panics with ErrTooLarge when
      2 * cap + n is more than MaxInt, which is less than 4 * Len + 5 * n,
      and otherwise allocates the larger of len(buf) + n and
      2 * (cap - off), which is less than 2 * Len + 3 * n, twice (make, then
      append, which rounds it up and panics past maxAlloc). This holds
      after Reset, which keeps the capacity, after Grow, and after reads,
      which move off.
    requires:
      - "b != nil"
      - "3 * (|b| + |p|) + 65536 <= MaxAlloc"
      - "5 * (|b| + |p|) <= MaxInt"
    modifies: [b]
    ensures:
      - "|b'| = |b| + |p|"
      - "n = |p|"
      - "err = nil"

  (*bytes.Buffer).WriteString:
    reason: >-
      Documented: "WriteString appends the contents of s to the buffer, growing the buffer as needed. The return value n is the length of s; err is always nil. If the buffer becomes too large, WriteString will panic with [ErrTooLarge]." The requires is read from the source of Go
      1.26.6 and 1.27.3 (buffer.go, tryGrowByReslice, grow, and growSlice;
      runtime/slice.go): the buffer moves only when what is written fits
      neither the free capacity after the write end (so cap - off < Len +
      n) nor half the capacity once the unread bytes are slid to the front
      (so cap < 2 * (Len + n)). Then grow panics with ErrTooLarge when
      2 * cap + n is more than MaxInt, which is less than 4 * Len + 5 * n,
      and otherwise allocates the larger of len(buf) + n and
      2 * (cap - off), which is less than 2 * Len + 3 * n, twice (make, then
      append, which rounds it up and panics past maxAlloc). This holds
      after Reset, which keeps the capacity, after Grow, and after reads,
      which move off.
    requires:
      - "b != nil"
      - "3 * (|b| + |s|) + 65536 <= MaxAlloc"
      - "5 * (|b| + |s|) <= MaxInt"
    modifies: [b]
    ensures:
      - "|b'| = |b| + |s|"
      - "n = |s|"
      - "err = nil"

  (*bytes.Buffer).WriteByte:
    reason: >-
      Documented: "WriteByte appends the byte c to the buffer, growing the buffer as needed. The returned error is always nil, but is included to match [bufio.Writer]'s WriteByte. If the buffer becomes too large, WriteByte will panic with [ErrTooLarge]." The requires is read from the source of Go
      1.26.6 and 1.27.3 (buffer.go, tryGrowByReslice, grow, and growSlice;
      runtime/slice.go): the buffer moves only when what is written fits
      neither the free capacity after the write end (so cap - off < Len +
      n) nor half the capacity once the unread bytes are slid to the front
      (so cap < 2 * (Len + n)). Then grow panics with ErrTooLarge when
      2 * cap + n is more than MaxInt, which is less than 4 * Len + 5 * n,
      and otherwise allocates the larger of len(buf) + n and
      2 * (cap - off), which is less than 2 * Len + 3 * n, twice (make, then
      append, which rounds it up and panics past maxAlloc). This holds
      after Reset, which keeps the capacity, after Grow, and after reads,
      which move off.
    requires:
      - "b != nil"
      - "3 * (|b| + 1) + 65536 <= MaxAlloc"
      - "5 * (|b| + 1) <= MaxInt"
    modifies: [b]
    ensures:
      - "|b'| = |b| + 1"
      - "result = nil"

  (*bytes.Buffer).WriteRune:
    reason: >-
      Documented: "WriteRune appends the UTF-8 encoding of Unicode code point r to the buffer, returning its length and an error, which is always nil but is included to match [bufio.Writer]'s WriteRune. The buffer is grown as needed; if it becomes too large, WriteRune will panic with [ErrTooLarge]. An encoding takes one to four bytes, one for a code point below 128, which WriteRune writes with WriteByte, and three for a value that is no code point, written as U+FFFD; for any other it grows the buffer by four." The requires is read from the source of Go
      1.26.6 and 1.27.3 (buffer.go, tryGrowByReslice, grow, and growSlice;
      runtime/slice.go): the buffer moves only when what is written fits
      neither the free capacity after the write end (so cap - off < Len +
      n) nor half the capacity once the unread bytes are slid to the front
      (so cap < 2 * (Len + n)). Then grow panics with ErrTooLarge when
      2 * cap + n is more than MaxInt, which is less than 4 * Len + 5 * n,
      and otherwise allocates the larger of len(buf) + n and
      2 * (cap - off), which is less than 2 * Len + 3 * n, twice (make, then
      append, which rounds it up and panics past maxAlloc). This holds
      after Reset, which keeps the capacity, after Grow, and after reads,
      which move off.
    requires:
      - "b != nil"
      - "3 * (|b| + 4) + 65536 <= MaxAlloc"
      - "5 * (|b| + 4) <= MaxInt"
    modifies: [b]
    ensures:
      - "1 <= n And n <= 4"
      - "0 <= r And r < 128 -> n = 1"
      - "|b'| = |b| + n"
      - "err = nil"

  (*bytes.Buffer).Grow:
    reason: >-
      Documented: "Grow grows the buffer's capacity, if necessary, to
      guarantee space for another n bytes. After Grow(n), at least n bytes
      can be written to the buffer without another allocation. If n is
      negative, Grow will panic. If the buffer can't grow it will panic with
      [ErrTooLarge]." Grow is grow(n) followed by cutting the buffer back to
      its length, which it keeps. The requires is read from the source of Go
      1.26.6 and 1.27.3 (buffer.go, tryGrowByReslice, grow, and growSlice;
      runtime/slice.go): the buffer moves only when what is written fits
      neither the free capacity after the write end (so cap - off < Len +
      n) nor half the capacity once the unread bytes are slid to the front
      (so cap < 2 * (Len + n)). Then grow panics with ErrTooLarge when
      2 * cap + n is more than MaxInt, which is less than 4 * Len + 5 * n,
      and otherwise allocates the larger of len(buf) + n and
      2 * (cap - off), which is less than 2 * Len + 3 * n, twice (make, then
      append, which rounds it up and panics past maxAlloc). This holds
      after Reset, which keeps the capacity, after Grow, and after reads,
      which move off.
    requires:
      - "b != nil"
      - "0 <= n"
      - "3 * (|b| + n) + 65536 <= MaxAlloc"
      - "5 * (|b| + n) <= MaxInt"
    modifies: [b]
    ensures:
      - "|b'| = |b|"

  (*bytes.Buffer).Len:
    reason: >-
      Documented: "Len returns the number of bytes of the unread portion of
      the buffer; b.Len() == len(b.Bytes())." That is what |b| is.
    requires:
      - "b != nil"
    modifies: []
    ensures:
      - "result = |b|"

  (*bytes.Buffer).String:
    reason: >-
      Documented: "String returns the contents of the unread portion of the
      buffer as a string. If the [Buffer] is a nil pointer, it returns
      "<nil>"." The entry says nothing of a nil Buffer and requires one that
      is not. The string is a copy.
    requires:
      - "b != nil"
    modifies: []
    ensures:
      - "|result| = |b|"

  (*bytes.Buffer).Bytes:
    reason: >-
      Documented: "Bytes returns a slice of length b.Len() holding the
      unread portion of the buffer. The slice is valid for use only until
      the next buffer modification ... The slice aliases the buffer
      content at least until the next buffer modification." It is
      buf[off:], which lies in the array the Buffer owns, from the read
      end to the capacity, so a later write through b may write it.
    requires:
      - "b != nil"
    modifies: []
    ensures:
      - "|result| = |b|"
      - "within(result, b)"

  (*bytes.Buffer).Reset:
    reason: >-
      Documented: "Reset resets the buffer to be empty, but it retains the
      underlying storage for use by future writes. Reset is the same as
      [Buffer.Truncate](0)." It keeps the array, so a later write may write
      over what Bytes returned before it.
    requires:
      - "b != nil"
    modifies: [b]
    ensures:
      - "|b'| = 0"

  (*bytes.Buffer).Truncate:
    reason: >-
      Documented: "Truncate discards all but the first n unread bytes from
      the buffer but continues to use the same allocated storage. It panics
      if n is negative or greater than the length of the buffer."
    requires:
      - "b != nil"
      - "0 <= n"
      - "n <= |b|"
    modifies: [b]
    ensures:
      - "|b'| = n"

  bytes.IndexFunc:
    reason: Documented to return the byte index in s of the first code point c satisfying f(c), or -1.
    runs: [f]
    calls:
      f(c): {}
    modifies: []
    ensures:
      - "result = -1 Or (0 <= result And result < |s|)"

  bytes.LastIndexFunc:
    reason: Documented to return the byte index in s of the last code point c satisfying f(c), or -1.
    runs: [f]
    calls:
      f(c): {}
    modifies: []
    ensures:
      - "result = -1 Or (0 <= result And result < |s|)"

  bytes.ContainsFunc:
    reason: Documented to report whether any code point r within b satisfies f(r), so it reports false for an empty b.
    runs: [f]
    calls:
      f(r): {}
    modifies: []
    ensures:
      - "result -> |b| > 0"

  bytes.TrimFunc:
    reason: Documented to return a subslice of s without its leading and trailing code points c that satisfy f(c).
    runs: [f]
    calls:
      f(c): {}
    modifies: []
    ensures:
      - "|result| <= |s|"

  bytes.TrimLeftFunc:
    reason: Documented to return a subslice of s without its leading code points c that satisfy f(c).
    runs: [f]
    calls:
      f(c): {}
    modifies: []
    ensures:
      - "|result| <= |s|"

  bytes.TrimRightFunc:
    reason: Documented to return a subslice of s without its trailing code points c that satisfy f(c).
    runs: [f]
    calls:
      f(c): {}
    modifies: []
    ensures:
      - "|result| <= |s|"

  bytes.Map:
    reason: >-
      Documented to return a copy of s with each character replaced by what
      mapping returns for it, or dropped where that is negative. Each byte
      becomes at most four, a character mapping returns for it, and the
      slice it grows may be given twice the room it needs, so the requires
      keeps that within the largest allocation.
    requires:
      - "8 * |s| + 65544 <= MaxAlloc"
    runs: [mapping]
    calls:
      mapping(r): {}
    modifies: []

  bytes.FieldsFunc:
    reason: >-
      Documented to split s at each run of code points c satisfying f(c),
      assuming that f always returns the same value for a given c; before Go
      1.10 it could crash otherwise. Nothing is claimed of the fields. It
      keeps the bounds of each field, sixteen bytes for each of at most
      |s| / 2 + 1, in a slice it grows by append, which may be given twice
      the room it needs, so the requires keeps that within the largest
      allocation.
    requires:
      - "16 * |s| + 65568 <= MaxAlloc"
    runs: [f]
    calls:
      f(c):
        deterministic: true
    modifies: []

  bytes.IndexByte:
    reason: >-
      "IndexByte returns the index of the first instance of c in b, or -1 if
      c is not present in b."
    modifies: []
    ensures:
      - "-1 <= result And result < |b|"
      - "result >= 0 -> b[result] = c"
      - "Forall k in [0, |b|) : (result = -1 Or k < result) -> b[k] != c"

  bytes.LastIndexByte:
    reason: >-
      "LastIndexByte returns the index of the last instance of c in s, or -1
      if c is not present in s."
    modifies: []
    ensures:
      - "-1 <= result And result < |s|"
      - "result >= 0 -> s[result] = c"
      - "Forall k in [result + 1, |s|) : s[k] != c"

  bytes.Index:
    reason: >-
      "Index returns the index of the first instance of sep in s, or -1 if
      sep is not present in s." Not said: that it is the first instance, and
      that -1 means sep is nowhere in s, for the reason given in the entry
      of strings.Index.
    modifies: []
    ensures:
      - "result = -1 Or (0 <= result And result + |sep| <= |s|)"
      - "result >= 0 -> Forall k in [0, |sep|) : s[result + k] = sep[k]"
      - "|sep| = 0 -> result = 0"

  bytes.LastIndex:
    reason: >-
      "LastIndex returns the index of the last instance of sep in s, or -1 if
      sep is not present in s." Not said: that it is the last instance, and
      that -1 means sep is nowhere in s, for the reason given in the entry of
      strings.Index.
    modifies: []
    ensures:
      - "result = -1 Or (0 <= result And result + |sep| <= |s|)"
      - "result >= 0 -> Forall k in [0, |sep|) : s[result + k] = sep[k]"
      - "|sep| = 0 -> result = |s|"

  bytes.Contains:
    reason: >-
      "Contains reports whether subslice is within b." Not said: the
      converse, for the reason given in the entry of strings.Contains.
    modifies: []
    ensures:
      - "result -> Exists i in [0, |b| - |subslice|] : Forall k in [0, |subslice|) : b[i + k] = subslice[k]"
      - "|subslice| = 0 -> result"

  bytes.HasPrefix:
    reason: >-
      "HasPrefix reports whether the byte slice s begins with prefix."
    modifies: []
    ensures:
      - "result <-> (|prefix| <= |s| And Forall k in [0, |prefix|) : s[k] = prefix[k])"

  bytes.HasSuffix:
    reason: >-
      "HasSuffix reports whether the byte slice s ends with suffix."
    modifies: []
    ensures:
      - "result <-> (|suffix| <= |s| And Forall k in [0, |suffix|) : s[|s| - |suffix| + k] = suffix[k])"

  bytes.Equal:
    reason: >-
      "Equal reports whether a and b are the same length and contain the
      same bytes. A nil argument is equivalent to an empty slice." In a
      formula, = between two slices compares their lengths and elements,
      which is this.
    modifies: []
    ensures:
      - "result <-> a = b"

  bytes.Count:
    reason: >-
      "Count counts the number of non-overlapping instances of sep in s. If
      sep is an empty slice, Count returns 1 + the number of UTF-8-encoded
      code points in s." Not said: the exact count.
    modifies: []
    ensures:
      - "result >= 0"
      - "|sep| > 0 -> result * |sep| <= |s|"
      - "|sep| = 0 -> 1 <= result And result <= |s| + 1"

  bytes.EqualFold:
    reason: >-
      "EqualFold reports whether s and t, interpreted as UTF-8 strings, are
      equal under simple Unicode case-folding, which is a more general form
      of case-insensitivity." Not said: which other slices it reports equal,
      which needs a model of Unicode's case folding.
    modifies: []
    ensures:
      - "s = t -> result"

  bytes.Cut:
    reason: >-
      "Cut slices s around the first instance of sep, returning the text
      before and after sep. The found result reports whether sep appears in
      s. If sep does not appear in s, cut returns s, nil, false. Cut returns
      slices of the original slice s, not copies." So before and after lie
      within s, and after is empty when sep is not found. Not said: that the
      instance is the first, for the reason given in the entry of
      strings.Index.
    modifies: []
    ensures:
      - "within(before, s) And within(after, s)"
      - "found -> |before| + |sep| + |after| = |s|"
      - "found -> Forall k in [0, |before|) : before[k] = s[k]"
      - "found -> Forall k in [0, |sep|) : s[|before| + k] = sep[k]"
      - "found -> Forall k in [0, |after|) : after[k] = s[|before| + |sep| + k]"
      - "~found -> before = s And |after| = 0"

  bytes.TrimPrefix:
    reason: >-
      "TrimPrefix returns s without the provided leading prefix string. If s
      doesn't start with prefix, s is returned unchanged." Read from the
      source of Go 1.26.6 (bytes.go, TrimPrefix): it returns s[len(prefix):]
      or s, so the result lies within s.
    modifies: []
    ensures:
      - "within(result, s)"
      - "(|prefix| <= |s| And Forall k in [0, |prefix|) : s[k] = prefix[k]) -> (|result| = |s| - |prefix| And Forall k in [0, |result|) : result[k] = s[|prefix| + k])"
      - "~(|prefix| <= |s| And Forall k in [0, |prefix|) : s[k] = prefix[k]) -> result = s"

  bytes.TrimSuffix:
    reason: >-
      "TrimSuffix returns s without the provided trailing suffix string. If s
      doesn't end with suffix, s is returned unchanged." Read from the source
      of Go 1.26.6 (bytes.go, TrimSuffix): it returns s[:len(s)-len(suffix)]
      or s, so the result lies within s.
    modifies: []
    ensures:
      - "within(result, s)"
      - "(|suffix| <= |s| And Forall k in [0, |suffix|) : s[|s| - |suffix| + k] = suffix[k]) -> (|result| = |s| - |suffix| And Forall k in [0, |result|) : result[k] = s[k])"
      - "~(|suffix| <= |s| And Forall k in [0, |suffix|) : s[|s| - |suffix| + k] = suffix[k]) -> result = s"

  bytes.TrimSpace:
    reason: >-
      "TrimSpace returns a subslice of s by slicing off all leading and
      trailing white space, as defined by Unicode." A subslice lies within
      s; the nil it returns for a slice of white space has no memory, which
      lies within anything. Not said: which bytes it removed, which needs a
      model of Unicode's white space.
    modifies: []
    ensures:
      - "|result| <= |s|"
      - "within(result, s)"

  bytes.Repeat:
    reason: >-
      "Repeat returns a new byte slice consisting of count copies of b. It
      panics if count is negative or if the result of (len(b) * count)
      overflows." Its result is made with exactly that length (Go 1.26.6,
      bytes.go), which must also be something that can be allocated.
    requires:
      - "count >= 0"
      - "|b| * count <= MaxAlloc"
      - "|b| * count <= MaxInt"
    modifies: []
    ensures:
      - "|result| = |b| * count"
      - "fresh(result)"

  bytes.Join:
    reason: >-
      "Join concatenates the elements of s to create a new byte slice. The
      separator sep is placed between elements in the resulting slice." Not
      said: its exact length, a sum the logic has no term for. Read from the
      source of Go 1.26.6 (bytes.go, Join): it checks the total as
      strings.Join does, whose entry gives the reason for the bound of
      MaxInt; it makes the result with exactly the total, and for one
      element copies it with append, which may round the room up, so the
      allocation is bounded with room to spare.
    requires:
      - "Forall i in [0, |s|) : |s| * (|s[i]| + |sep| + 1) <= MaxInt"
      - "Forall i in [0, |s|) : |s| * (|s[i]| + |sep| + 1) + 65536 <= MaxAlloc"
    modifies: []
    ensures:
      - "|s| = 0 -> |result| = 0"
      - "|s| = 1 -> result = s[0]"
      - "Forall i in [0, |s|) : |s[i]| <= |result|"
      - "|s| >= 2 -> (|s| - 1) * |sep| <= |result|"
      - "|s| > 0 -> Exists i in [0, |s|) : |result| <= |s| * (|s[i]| + |sep|)"
      - "fresh(result)"

  bytes.Replace:
    reason: >-
      "Replace returns a copy of the slice s with the first n non-overlapping
      instances of old replaced by new. If old is empty, it matches at the
      beginning of the slice and after each UTF-8 sequence, yielding up to
      k+1 replacements for a k-rune slice. If n < 0, there is no limit on the
      number of replacements." A copy is new memory. Not said: what the
      result holds. Read from the source of Go 1.26.6 (bytes.go, Replace): it
      makes len(s) + n*(len(new)-len(old)) bytes for n replacements, or
      copies s with append when there is none, which may round the room up;
      the requires keep the int arithmetic and the allocation within MaxInt
      and MaxAlloc, also where an int has 32 bits.
    requires:
      - "|s| + (|s| + 1) * |new| <= MaxInt"
      - "|s| + (|s| + 1) * |new| + 65536 <= MaxAlloc"
    modifies: []
    ensures:
      - "|result| <= |s| + (|s| + 1) * |new|"
      - "n = 0 -> result = s"
      - "old = new -> result = s"
      - "fresh(result)"

  bytes.ReplaceAll:
    reason: >-
      "ReplaceAll returns a copy of the slice s with all non-overlapping
      instances of old replaced by new. If old is empty, it matches at the
      beginning of the slice and after each UTF-8 sequence, yielding up to
      k+1 replacements for a k-rune slice." It is Replace with n = -1 (Go
      1.26.6, bytes.go), so its requires are those of Replace. Not said: what
      the result holds.
    requires:
      - "|s| + (|s| + 1) * |new| <= MaxInt"
      - "|s| + (|s| + 1) * |new| + 65536 <= MaxAlloc"
    modifies: []
    ensures:
      - "|result| <= |s| + (|s| + 1) * |new|"
      - "old = new -> result = s"
      - "fresh(result)"
