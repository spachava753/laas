version: 1

trusted:
  strings.Contains:
    reason: Documented to report whether substr is within s; it reads its arguments only.
    modifies: []

  strings.HasPrefix:
    reason: Documented to report whether s begins with prefix.
    ensures:
      - "result <-> (|prefix| <= |s| And Forall k in [0, |prefix|) : s[k] = prefix[k])"
    modifies: []

  strings.HasSuffix:
    reason: Documented to report whether s ends with suffix.
    ensures:
      - "result <-> (|suffix| <= |s| And Forall k in [0, |suffix|) : s[|s| - |suffix| + k] = suffix[k])"
    modifies: []

  strings.Index:
    reason: Documented to return the index of the first instance of substr in s, or -1.
    ensures:
      - "result = -1 Or (0 <= result And result + |substr| <= |s|)"
    modifies: []

  strings.TrimSpace:
    reason: Documented to return a slice of s with leading and trailing white space removed.
    ensures:
      - "|result| <= |s|"
    modifies: []

  strings.Repeat:
    reason: >-
      Documented to return count copies of s, and to panic if count is
      negative or the result would overflow. A result longer than the
      largest allocation cannot be made either.
    requires:
      - "count >= 0"
      - "|s| * count <= MaxAlloc"
      - "|s| * count <= MaxInt"
    ensures:
      - "|result| = |s| * count"
    modifies: []

  strings.ToUpper:
    reason: Documented to return s mapped to upper case; the length may change.
    modifies: []

  strings.ToLower:
    reason: Documented to return s mapped to lower case; the length may change.
    modifies: []

  strings.IndexFunc:
    reason: Documented to return the index into s of the first code point c satisfying f(c), or -1.
    runs: [f]
    calls:
      f(c): {}
    modifies: []
    ensures:
      - "result = -1 Or (0 <= result And result < |s|)"

  strings.LastIndexFunc:
    reason: Documented to return the index into s of the last code point c satisfying f(c), or -1.
    runs: [f]
    calls:
      f(c): {}
    modifies: []
    ensures:
      - "result = -1 Or (0 <= result And result < |s|)"

  strings.ContainsFunc:
    reason: Documented to report whether any code point r within s satisfies f(r), so it reports false for an empty s.
    runs: [f]
    calls:
      f(r): {}
    modifies: []
    ensures:
      - "result -> |s| > 0"

  strings.TrimFunc:
    reason: Documented to return a slice of s with all leading and trailing code points c satisfying f(c) removed.
    runs: [f]
    calls:
      f(c): {}
    modifies: []
    ensures:
      - "|result| <= |s|"

  strings.TrimLeftFunc:
    reason: Documented to return a slice of s with all leading code points c satisfying f(c) removed, which is what ends s.
    runs: [f]
    calls:
      f(c): {}
    modifies: []
    ensures:
      - "|result| <= |s|"
      - "Forall k in [0, |result|) : result[k] = s[|s| - |result| + k]"

  strings.TrimRightFunc:
    reason: Documented to return a slice of s with all trailing code points c satisfying f(c) removed, which is what begins s.
    runs: [f]
    calls:
      f(c): {}
    modifies: []
    ensures:
      - "|result| <= |s|"
      - "Forall k in [0, |result|) : result[k] = s[k]"

  strings.Map:
    reason: Documented to return a copy of s with each character replaced by what mapping returns for it, or dropped where that is negative.
    runs: [mapping]
    calls:
      mapping(r): {}
    modifies: []

  strings.FieldsFunc:
    reason: >-
      Documented to split s at each run of code points c satisfying f(c),
      assuming that f always returns the same value for a given c; before Go
      1.10 it could crash otherwise. Nothing is claimed of the fields.
    runs: [f]
    calls:
      f(c):
        deterministic: true
    modifies: []
