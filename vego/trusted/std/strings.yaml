version: 1

trusted:
  strings.Contains:
    reason: Documented to report whether substr is within s; it reads its arguments only.

  strings.HasPrefix:
    reason: Documented to report whether s begins with prefix.
    ensures:
      - "result <-> (|prefix| <= |s| And Forall k in [0, |prefix|) : s[k] = prefix[k])"

  strings.HasSuffix:
    reason: Documented to report whether s ends with suffix.
    ensures:
      - "result <-> (|suffix| <= |s| And Forall k in [0, |suffix|) : s[|s| - |suffix| + k] = suffix[k])"

  strings.Index:
    reason: Documented to return the index of the first instance of substr in s, or -1.
    ensures:
      - "result = -1 Or (0 <= result And result + |substr| <= |s|)"

  strings.TrimSpace:
    reason: Documented to return a slice of s with leading and trailing white space removed.
    ensures:
      - "|result| <= |s|"

  strings.Repeat:
    reason: >-
      Documented to return count copies of s, and to panic if count is
      negative or the result would overflow.
    requires:
      - "count >= 0"
      - "|s| * count <= MaxInt"
    ensures:
      - "|result| = |s| * count"

  strings.ToUpper:
    reason: Documented to return s mapped to upper case; the length may change.

  strings.ToLower:
    reason: Documented to return s mapped to lower case; the length may change.
