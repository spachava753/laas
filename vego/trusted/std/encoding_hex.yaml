# Contracts for package encoding/hex of the standard library.
version: 1

trusted:
  encoding/hex.EncodeToString:
    reason: >-
      Read from the source of Go 1.26.6 and 1.27.3, which is the same: it
      makes a slice of EncodedLen(len(src)) = len(src) * 2 bytes, writes two
      hexadecimal digits of each byte of src into it, which only reads src,
      and returns the string of that slice. EncodedLen computes the length
      as an int, which wraps when 2 * len(src) is more than MaxInt, and make
      panics with "len out of range" on a negative length and on one more
      than an allocation can hold; the requires rules out both. On a 32-bit
      target MaxInt is the smaller, and 1 << 30 bytes already panic, which
      TestHex386 holds against the runtime. Which digits it writes is not
      modelled.
    requires:
      - "2 * |src| <= MaxAlloc"
      - "2 * |src| <= MaxInt"
    ensures:
      - "|result| = 2 * |src|"
    modifies: []
